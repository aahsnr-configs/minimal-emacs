document:
  title: "Native `package.el` & `package-vc.el` Integration: Architecture, Quickstart Physics, and Load-Order Execution (v2)"
  description: >
    This document provides a canonical, unified breakdown of Emacs 31's native `package.el`
    and `package-vc.el` package managers and their integration with the `use-package` macro
    (v2.4.5+, bundled with Emacs 30.2+). It details `package.el`'s archive-based tarball model,
    `package-vc.el`'s direct Git source integration, the `package-quickstart` performance
    mechanism, built-in package bifurcation physics, and chronological load-order dependencies.
    All definitions are derived from the official GNU Emacs Manual, the official GNU Emacs
    `use-package` User Manual, the upstream `use-package` source (jwiegley/use-package),
    and Emacs 31 core source code. Verified current as of July 2026.
  sections:
    - id: 1
      title: Core Philosophy
      points:
        - >
          `package.el` is the synchronous, archive-based elisp package manager built into Emacs.
          Packages are downloaded as pre-compiled tarballs from ELPA/MELPA/NonGNU ELPA, extracted
          into `~/.emacs.d/elpa/`, and registered into the `load-path`.
        - >
          `package-vc.el` (integrated natively in Emacs 29+) extends `package.el` to support
          direct Git repository cloning for packages not available on standard archives, or for
          tracking the latest upstream commits.
        - >
          `use-package` is not a package manager. Its primary purpose is to organize package
          configuration declaratively, eliminate repetitive boilerplate, and enable lazy-loading
          (autoloading) to keep Emacs startup times low.
        - >
          CRITICAL PERFORMANCE MECHANISM (`package-quickstart`): Unlike third-party managers that
          build packages asynchronously or synchronously inline, `package.el` relies on
          `package-quickstart`. When enabled in `early-init.el`, Emacs pre-computes all package
          load paths and autoloads into a single compiled `package-quickstart.el` file. This
          bypasses the expensive iteration over `~/.emacs.d/elpa/` directories during startup,
          providing stutter-free, near-instantaneous activation.
      files:
        - path: "~/.emacs.d/early-init.el"
          note: >
            `package-enable-at-startup` MUST be `nil` here to prevent double-initialization,
            because we manually invoke `(require 'package)` and `(package-initialize)` in
            `init.el`. `package-quickstart` and `package-install-upgrade-built-in` must be
            configured in `init.el` strictly before `(package-initialize)` is called.

    - id: 2
      title: The Synchronous Execution Timeline
      description: >
        Because `package-quickstart` pre-computes the environment, the "timeline" is a single
        linear pass through the init file, interrupted only by `use-package`'s own internal
        keyword-processing order (`use-package-keywords`) at each individual `use-package` form.
      phases:
        - name: "Phase 0: Bootstrap (Synchronous, early-init.el & init.el)"
          items:
            - event: "Early-Init Suppression"
              description: >
                `package-enable-at-startup` is set to `nil` in `early-init.el` to prevent
                Emacs from automatically initializing the package system before `init.el` loads.
            - event: "Archive Registration & Quickstart Activation"
              description: >
                In `init.el`, `package-archives` is populated. `package-quickstart` is set to `t`,
                and `package-install-upgrade-built-in` is set to `t`.
            - event: "Manual Initialization"
              description: >
                `(require 'package)` and `(package-initialize)` are called. Emacs loads
                `package-quickstart.el`, instantly registering all `load-path` entries and
                autoloads without scanning the filesystem.
        - name: "Phase 1: Per-Package Installation & Autoload Activation (Inline, during init read)"
          description: >
            This phase happens once per `use-package` form when `:ensure t` (or
            `use-package-always-ensure`) triggers `package-install`, or when `:vc` triggers
            `package-vc-install`.
          items:
            - event: "Archive Query & Download (if needed)"
              description: >
                If the package is missing from `~/.emacs.d/elpa/`, `package.el` queries the
                configured archives, downloads the tarball, and extracts it.
            - event: "VC Clone (if `:vc` is used)"
              description: >
                If the `:vc` keyword is present, `package-vc.el` clones the Git repository
                directly into `~/.emacs.d/elpa/`. If `use-package-vc-prefer-newest` is `t`,
                it tracks the latest commit rather than release tags.
            - event: "Autoload Activation"
              description: >
                Once installed, the package's autoloads are registered. This makes autoloaded
                commands callable, but it does NOT `require` the package's features. `defcustom`,
                `defvar`, and `defun` forms inside the package's main file are NOT yet evaluated.
        - name: "Phase 2: use-package's Own Keyword Pipeline (per form)"
          description: >
            Independent of `package.el`, `use-package-core.el` defines a fixed evaluation order via
            the `use-package-keywords` defcustom. Its BASE order is:
            `:disabled :load-path :requires :defines :functions :preface :if :when :unless :no-require :catch :after :custom :custom-face :bind :bind* :bind-keymap :bind-keymap* :interpreter :mode :magic :magic-fallback :hook :commands :autoload :init :defer :demand :load :config`.
            Note `:load` sits directly before `:config`, near the very end.
          items:
            - event: ":ensure / :vc (package.el's integration point)"
              description: >
                `:ensure t` triggers `package-install`. `:vc (:url "...")` triggers
                `package-vc-install`. If `use-package-always-ensure` is `t`, `:ensure` is
                implicit for all packages unless `:ensure nil` is specified.
            - event: ":init"
              description: >
                Evaluated before `:load` / `:config`. WARNING: because `package.el` has already
                installed and autoload-activated the package by this point, it is tempting to
                assume the package is "ready." It is not — its `defcustom` / `defvar` / `defun`
                forms have not been evaluated yet. Referencing package-specific variables here
                still typically raises a `void-variable` error.
            - event: ":load / (implicit require)"
              description: >
                This is where `use-package` actually loads the package for non-deferred
                declarations. This is the true "boundary" — the point at which `(require 'foo)`
                happens and the package's real symbols exist.
            - event: ":config"
              description: >
                Evaluated after the package has fully loaded. This is the bulletproof phase for
                modifying a package's internal `defcustom` lists, altering keymaps, advising
                functions, and activating global minor modes.

    - id: 3
      title: Anatomy of a `:vc` Recipe
      keywords:
        - name: ":url"
          description: "The HTTPS or SSH URL of the Git repository (e.g., `:url \"https://github.com/user/repo\"`)."
        - name: ":branch"
          description: "Git branch to track/check out. If `use-package-vc-prefer-newest` is `t`, the latest commit on this branch is pulled."
        - name: ":rev"
          description: "Specific commit hash or tag to pin. Overrides `:branch` and `use-package-vc-prefer-newest`."
        - name: ":vc-dir"
          description: "Optional override for the local installation directory under `~/.emacs.d/elpa/`."
      note: >
        Unlike `straight.el` recipes, `package-vc.el` does not use `:host` or `:repo` abstractions.
        You must provide the fully resolved `:url`.

    - id: 4
      title: "Detailed `use-package` Keyword Breakdown (package.el-specific)"
      keywords:
        - name: ":ensure"
          subtitle: Archive Installation & Built-in Bifurcation
          details:
            - label: Mechanism
              text: >
                `:ensure t` forces `package-install` to fetch the package from `package-archives`.
                `:ensure nil` prevents installation (used for built-in packages or local `lisp/` scripts).
            - label: Global default
              text: >
                Set `use-package-always-ensure` to `t` to make every `use-package` form implicitly
                behave as though `:ensure t` were given.
            - label: Built-in Package Bifurcation (CRITICAL)
              text: >
                When `use-package-always-ensure` and `package-install-upgrade-built-in` are both `t`,
                you must strictly bifurcate built-in packages into two groups:
                1. "Strictly Native" core primitives (e.g., `xref`, `eldoc`, `simple`, `saveplace`,
                `repeat`, `paren`). You MUST explicitly declare `:ensure nil` for these. Failing to
                do so forces `package.el` to query ELPA on startup, degrading `package-quickstart`
                performance and risking the shadowing of stable C-core primitives with unrelated
                or broken ELPA forks.
                2. "Shadowable" built-ins (e.g., `org`, `project`, `compat`). DO NOT use `:ensure nil`
                for these. Omitting it allows the package manager to seamlessly pull the bleeding-edge
                GNU ELPA release, successfully shadowing the older Emacs 31 built-in version.
        - name: ":vc"
          subtitle: Direct Git Source Installation
          details:
            - label: Mechanism
              text: >
                `:vc` accepts a property list (e.g., `:vc (:url "https://github.com/user/repo")`)
                and routes installation through `package-vc-install`.
            - label: Global default
              text: >
                Set `use-package-vc-prefer-newest` to `t` to force all `:vc` packages to pull
                the latest commit rather than relying on stale release tags.
        - name: ":init"
          subtitle: Pre-Load Execution (The "Unconditional" Trap)
          details:
            - label: Constraint
              text: >
                Even though `package.el` has already installed and autoload-activated the package
                by the time `:init` runs, the package's actual functions and variables generally
                don't exist yet, because the real `(require ...)` happens later, at `use-package`'s
                own `:load` position. Referencing them in `:init` typically still raises a
                `void-function` or `void-variable` error.
        - name: ":config"
          subtitle: Post-Load Execution (The Safe Zone)
          details:
            - label: Best Practice
              text: >
                Keep `:init` forms minimal and put as much as possible into `:config`. The reasoning
                is `use-package`'s own keyword order, not anything specific to `package.el`.

    - id: 5
      title: "Case Study: The `evil-snipe` `defcustom` List Modification"
      problem:
        description: >
          In an `evil-snipe` configuration, a list of UI modes must be appended to
          `evil-snipe-disabled-modes` to prevent the package from hijacking native keybindings.
      analysis:
        - approach: "Why `:init` Fails"
          explanation: >
            By the time `:init` runs, `package.el` HAS already installed and autoload-activated
            `evil-snipe`. But `use-package`'s `:load` step — the point at which `(require 'evil-snipe)`
            actually happens and its top-level `defcustom` forms run — sits AFTER `:init`.
            So at `:init` time, `evil-snipe-disabled-modes` is still unbound. Calling `add-to-list`
            signals a `void-variable` error.
        - approach: "Why `:config` is Bulletproof"
          explanation: >
            Placing the `dolist` at the very beginning of `:config` guarantees this sequence:
            1. `use-package`'s `:load` step runs first: `(require 'evil-snipe)` evaluates, and its
               `defcustom` registers the upstream default list.
            2. Your modification runs: the `dolist` executes, safely appending your custom modes.
            3. The mode activates: `(evil-snipe-mode 1)` executes only after your modification.

    - id: 6
      title: Obsolete / Superseded / Inapplicable Paradigms Under package.el
      points:
        - keyword: ":straight / straight-use-package-by-default"
          claim: "These are required for modern Emacs package management."
          correction: >
            Obsolete under native `package.el`. `straight.el` is a third-party git-based manager
            that completely replaces `package.el`. Under native Emacs 31, use `:ensure` and
            `use-package-always-ensure`. For Git sources, use `:vc`.
        - keyword: ":straight (:type built-in)"
          claim: "This is how you declare native Emacs packages."
          correction: >
            Obsolete under native `package.el`. The `straight.el` recipe syntax `:straight (:type built-in)`
            must be mapped to `:ensure nil` for strictly native core primitives (like `xref`, `eldoc`,
            or `repeat`), or removed entirely for shadowable built-ins (like `org` or `project`)
            where you want `package.el` to pull the latest ELPA version.
        - keyword: ":pin"
          claim: "`:pin` is used to lock package versions."
          correction: >
            Under `package.el`, `:pin` restricts a package to a specific archive (e.g., pinning
            `org` to `gnu` to prevent MELPA from overriding it). It does NOT pin to a specific
            commit hash. To pin a Git commit, use the `:rev` property inside a `:vc` plist.
        - keyword: "straight-freeze-versions / lockfiles"
          claim: "Lockfiles are required for reproducible builds."
          correction: >
            Inapplicable. `package.el` persists installed packages natively via `custom-set-variables`
            in `custom.el` using `package-selected-packages` and `package-vc-selected-packages`.
            To pin a specific commit for a GitHub package, hardcode the `:rev "commit-hash"` in the
            `:vc` plist.
        - keyword: "package-quickstart"
          claim: "package-quickstart is an optional optimization."
          correction: >
            Under a heavy IDE configuration, `package-quickstart` is MANDATORY. Without it,
            `package.el` must iterate over every subdirectory in `~/.emacs.d/elpa/` on every
            startup to register load paths and autoloads, causing severe main-thread blocking
            and startup latency.

    - id: 7
      title: "Ecosystem Tooling: Keeping Packages Up To Date (including topgrade)"
      description: >
        General-purpose "upgrade everything" tools natively understand `package.el`.
      points:
        - topic: "Interactive, in-Emacs update workflow (canonical)"
          detail: >
            `M-x package-update-all` fetches and upgrades all archive packages.
            `M-x package-vc-update-all` pulls the latest commits for all `:vc` installed packages.
        - topic: "topgrade: native package.el step exists"
          detail: >
            Unlike `straight.el`, topgrade's built-in `[emacs]` step is explicitly designed around
            `package.el`. It automatically handles `package-refresh-contents` and `package-update-all`.
            No custom `[commands]` batch scripts are required. Simply ensure `disable = ["emacs"]`
            is NOT present in your `topgrade.toml`.

    - id: 8
      title: Verification Notes
      points:
        - "Primary Source: Official GNU Emacs `use-package` User Manual (v2.4.5, bundled with Emacs 30.2+)."
        - "Primary Source: `jwiegley/use-package` upstream, `use-package-core.el` (base `use-package-keywords` order) and `use-package-ensure.el`."
        - "Primary Source: GNU Emacs Manual, 'Package Installation' and 'Package VC' chapters."
        - >
          Emacs 31 Context: Emacs 31 entered its feature-freeze/branch-cut phase near June 2026.
          Public release previews confirm `package-quickstart`, `package-install-upgrade-built-in`,
          and `use-package-vc-prefer-newest` are stable and fully integrated into the core.
        - >
          Built-in Bifurcation Logic: Verified against Emacs 29+ `package.el` source code.
          `package-install-upgrade-built-in` explicitly allows shadowing, making the distinction
          between "Strictly Native" (`:ensure nil`) and "Shadowable" (omit `:ensure nil`)
          mathematically required to prevent startup I/O degradation.