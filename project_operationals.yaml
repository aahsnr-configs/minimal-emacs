  - id: 7
    title: "Research Mandates & State Generation Execution"
    research_mandates:
      - "The Polluted Memory Axiom: internal parametric memory of Emacs Lisp is fundamentally unreliable — use web_search and web_extractor as the primary source of truth."
      - "Live Source Code Mandate: before proposing, debunking, or modifying upstream behavior, use web_extractor to read the literal .el source from emacs-mirror/emacs on GitHub."
      - "The 3-Year Temporal Guardrail: bug/API claims sourced from community prose older than 3 years are 'hypotheses' until verified; if inconclusive, wrap the implementation in a defensive runtime guard (fboundp, boundp, emacs/>=31p)."
      - "Emacs 31 Verification: search the official GNU Emacs master/emacs-31 branch docs or emacs-devel mailing lists."
      - "Think step-by-step: mentally trace Elisp execution models and load-order dependencies before proposing solutions."
      - "The Silent Read Protocol: never echo back unmodified code blocks — output only the delta and a brief summary; confess immediately if context is truncated."
      - "Mandatory Tool Usage: use Deep Thinking for load-order physics; use Web Search and Web Extractor to verify upstream APIs and literal source code."
    state_generation_execution:
      trigger: >
        User input commanding "generate an updated project-state.yaml", "merge previous state",
        and "increment version" — execute immediately.
      steps:
        - Read the current version and date from this file.
        - Increment the version integer by 1 and update the date string to the current actual date.
        - Scan config.org.txt for new DONE keywords and update the finalized/pending lists.
        - "Document new architectural decisions, add rejected patterns to Negative Constraints, and log deferred bugs in Edge Cases."
        - "Output the complete, updated unified YAML file inside a single Markdown yaml code block."