        - "[v46 Note] Org Super Agenda Physics Verification: Confirmed `:take (15 (:anything t))` is the mathematically required upstream nested-list syntax for `cl-defun` destructuring in global defaults. Confirmed `nerd-icons:demand t` negates the need for `fboundp` guards."
        - "[v46 Note] Org Capture & Popper Collision: The `*Capture*` and `CAPTURE-` regexes must be manually excised from `popper-reference-buffers` in v0.22 to prevent redisplay race conditions with the new bottom-drawer routing."
        - "[v46 Note] Denote 4.x Signature Parity: Injected 5th `%s` placeholder (`#+signature: %s`) into `my/ensure-denote-silo` front-matter template to guarantee `denote-sequence` hierarchy rendering inside isolated silos."
        - "[v46 Note] Hide Modeline Hook Duplication: `org-agenda-finalize-hook` is currently registered in both `Org Agenda` and `Hide Modeline` subsections in v0.21. Must be excised from `Hide Modeline` to obey Domain-Driven Hook Encapsulation."
        - "[v47 Note] Emacs 31 Tree-sitter Native Auto-Install: Excised Emacs 30 manual `major-mode-remap-alist` and `treesit-install-language-grammar` advice dead code. Emacs 31 natively handles auto-installation via `treesit-auto-install-grammar` and mode routing via `treesit-enabled-modes`."
        - "[v47 Note] Babel Lazy-Loading Engine: Implemented Doom Emacs parity triad of `nadvice.el` advices (`org-babel-exp-src-block`, `org-src--get-lang-mode`, `org-babel-confirm-evaluate`) to eliminate the synchronous `org-babel-do-load-languages` startup tax. Deferred `emacs-jupyter` due to ZeroMQ kernel initialization physics."
        - "[v47 Note] Transient Template System O(1) Guard: Replaced the catastrophic O(N) `looking-back` regex trap with an O(1) `skip-chars-backward` spatial guard. Refactored inline lambdas to named interactive commands via `defalias` to prevent Transient lambda bloat."
        - "[v47 Note] Hideshow Emacs 31 Indicators: Integrated native `hs-show-indicators`, `hs-indicator-type`, and `hs-display-lines-hidden`. Excised the obsolete `hs-special-modes-alist` fallback and custom `ar/hs-overlay-line-count` dead code."
        - "[v48 Note] eglot-confirm-server-edits has a known type-error bug (#80549) when customized via M-x customize in Emacs 31.0.50. Setting via setq/:custom is safe."
        - "[v48 Note] The Eglot manual index lists 'eglot-call-type-hierarchy' for call hierarchy, but upstream source code (Jan 2026) defines 'eglot-show-call-hierarchy'. Using the source-code name. If renamed upstream, update keybindings."
        - "[v48 Note] eglot-code-action-indicator is a defvar (not defcustom) defaulting to nil. Setting to a string like 💡 enables the visual lightbulb. May cause rendering glitches in TTY; fall back to ⚡ or * if needed."
        - "[v48 Note] eglot--apply-workspace-edit takes (WEDIT ORIGIN) — 2 args in Emacs 31. NOT (SERVER WEDIT &optional ORIGIN). Verified against upstream eglot.el source (Jan 2026 sync)."
        - "[v48 Note] eglot-path-to-uri is the correct public function. eglot--path-to-uri is obsolete since Eglot 1.16. Similarly eglot-uri-to-path replaces eglot--uri-to-path."
        - "[v48 Note] eglot-semantic-tokens-mode and eglot-inlay-hints-mode are NOT active by default. There is NO global-eglot-inlay-hints-mode or global-eglot-semantic-tokens-mode. They must be activated via eglot-managed-mode-hook."
        - "[v48 Note] Inlay hint face names are eglot-type-hint-face and eglot-parameter-hint-face, NOT eglot-inlay-hint-type-face and eglot-inlay-hint-parameter-face."
        - "[v48 Note] eglot-code-action-indications accepts 'nearby, 'margin, 'eldoc-hint. NOT 'mode-line. Verified against upstream source and Eglot manual §4.1."
