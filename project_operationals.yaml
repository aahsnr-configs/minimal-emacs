        - "[v34 Note] Org Super Agenda Subsection Still Has 4 Bugs: The global default groups still contain: (1) defconst instead of defvar, (2) :take (15 (:anything t)) wrong nesting, (3) :property dotted pair, (4) no fboundp guards on nerd-icons calls."
