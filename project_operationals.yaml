        - "[v33 Note] Org-Super-Agenda :take + keep-order: The README warns :take order is not guaranteed. Mitigated by org-super-agenda-keep-order t which re-sorts items post-grouping, preserving org-agenda-sorting-strategy order before :take selects."
        - "[v34 Fix] Custom Commands :take Nesting Bug: The original code used `:take (15 (:anything t))` which produced `group = ((:anything t))` — a list containing a list, not a valid plist. Fixed to `:take (15 :anything t)`."
        - '[v34 Fix] Custom Commands :property Dotted Pair Bug: The original code used `:property ("ENERGY" . "high")` — a dotted pair. Fixed to proper list syntax `:property ("ENERGY" "high")`.'
        - "[v34 Fix] Custom Commands defconst Reload Warning: All five group definitions used `defconst` with eager `nerd-icons-faicon` calls. Fixed to `defvar` with `fboundp` guards and Unicode symbol fallbacks."
