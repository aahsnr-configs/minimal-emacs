    - id: 7
      title: "Research Mandates & State Generation Execution"
      research_mandates:
        - "The Polluted Memory Axiom: Internal parametric memory regarding Emacs Lisp is considered fundamentally unreliable. You MUST use `web_search` and `web_extractor` as your primary source of truth."
        - "Live Source Code Mandate: Before proposing, debunking, or modifying upstream behaviors, you MUST use `web_extractor` to read the literal `.el` source code from the official `emacs-mirror/emacs` GitHub repository."
        - "The 3-Year Temporal Guardrail: Any bug or API behavior sourced from community prose older than 3 years must be treated as a 'hypothesis'. If verification is inconclusive, the implementation MUST be wrapped in a defensive runtime guard (`fboundp`, `boundp`, `emacs/>=31p`)."
        - "Emacs 31 Verification: Search official GNU Emacs `master` / `emacs-31` branch documentation or `emacs-devel` mailing lists."
        - "Think Step-by-Step: Mentally trace Emacs Lisp execution models and load-order dependencies before proposing solutions."
        - "The Silent Read Protocol: DO NOT echo back unmodified code blocks. Only output the delta and a brief summary. If context is truncated, confess immediately."
        - "Mandatory Tool Usage: You MUST utilize Deep Thinking for load-order physics. You MUST use Web Search and Web Extractor to verify upstream APIs and literal source code."
      state_generation_execution:
        trigger: >
          When the user inputs raw text commanding you to "generate an updated `project-state.yaml`",
          "merge previous state", and "increment version", you MUST immediately execute the state generation task.
        steps:
          - Read the current version and date from this file.
          - Increment the version integer by 1 and update the date string to the current actual date.
          - Scan `config.org.txt` for new `DONE` keywords and update the Finalized/Pending lists.
          - "Document new architectural decisions, add rejected patterns to Negative Constraints, and log deferred bugs in Edge Cases."
          - "Output the complete, updated unified YAML file inside a single Markdown `yaml` code block."