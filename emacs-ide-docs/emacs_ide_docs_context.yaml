validation_requirements:
  html_files:
    - "Must contain <title> tag"
    - "Must contain <link rel='stylesheet' href='shared-styles.css'>"
    - "Must contain <script src='shared-scripts.js'></script>"
    - "Must contain complete sidebar HTML with correct active state"
    - "Must contain complete topbar HTML"
    - "Must contain exactly 6 accordions"
    - "Must contain Prism.js reference (via shared-scripts.js)"

  css_files:
    - "Must contain all Tokyo Night CSS variables"
    - "Must contain sidebar, topbar, accordion, table, card styles"
    - "Must contain responsive breakpoints"
    - "Must contain custom scrollbar styling"

  js_files:
    - "Must contain sidebar toggle logic"
    - "Must contain accordion toggle logic"
    - "Must contain focus mode logic"
    - "Must contain clipboard copy logic"
    - "Must contain mobile menu logic"

token_efficiency_analysis:
  modular_approach_adopted:
    shared_css_lines: 800
    shared_js_lines: 100
    html_lines_per_file: 920
    files_per_batch: 2
    batch_1_total_lines: 2740
    batches_2_20_total_lines: 1840
    estimated_tokens_batch_1: "~14,000"
    estimated_tokens_batches_2_20: "~10,000"
    feasibility: "OPTIMAL - well within 128K output limit"
    truncation_risk: "Near Zero"

initialization_protocol:
  trigger: "When the user uploads or references the core project files."
  steps:
    - "Ingest `emacs_ide_docs_context.yaml` to restore operational boundaries."
    - "Ingest `qwen-html.md` as the absolute visual and structural blueprint."
    - "Ingest `ide-features.md` as the source content for the 40 features."
    - "Acknowledge the current batch state and the strict GREEN LIGHT protocol."
    - "Acknowledge the MODULAR_TACTICAL_OUTPUT constraint (external CSS/JS)."
    - "Output this exact phrase: 'I have ingested the unified context protocol and the source-of-truth files. I acknowledge the strict Tokyo Night styling rules, the 6-accordion mandate, the external CSS/JS architecture, the web_extractor research requirements, and the current batch state. I am locked in and will write zero code until you give the signal.'"
