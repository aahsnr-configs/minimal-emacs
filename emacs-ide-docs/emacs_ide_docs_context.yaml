metadata:
  title: Emacs IDE Documentation - Unified Context & State Protocol
  version: 2.1
  date: July 18, 2026
  knowledge_cutoff: July 2026
  project_type: Frontend Documentation Generation (Agentic Workflow)
  architecture_decision: "Option A - External CSS/JS (Modular Tactical Output)"
  project_phase: >
    Batches 1-20 are COMPLETE (40 HTML files generated in features/). The project is now
    in Phase 3 planning: migrating the completed tactical output to Astro 6.x. Do not
    regenerate any of the 40 feature files unless explicitly asked to fix a specific one.
  rationale: >
    External CSS/JS reduces per-file output by ~33%, aligns with the Astro 6.x strategic
    architecture (retargeted from 5.x — Astro 6 has been stable since March 10, 2026, and
    Astro is now Cloudflare-owned), and respects 2026 LLM output token limits. A 20-batch
    workflow (2 features per batch) ensured ~14,000 tokens per generation, eliminating
    truncation risks and reasoning degradation. This batching phase is now complete.

cognitive_and_research_mandates:
  think_longer_protocol:
    description: >
      Before generating any HTML, CSS, or JavaScript, you must mentally trace
      CSS cascade physics, JS hydration timing, DOM layout shifts, and Astro 6.x
      Content Collection schemas. You must think longer and deeply evaluate edge cases
      (e.g., Clipboard API secure-context fallbacks, ARIA state management, mobile
      overlay traps, and grid blowouts) before outputting any code.

  polluted_memory_axiom:
    description: >
      Internal parametric memory regarding CSS3, modern JavaScript APIs, and Astro 6.x
      is considered fundamentally unreliable and heavily polluted with outdated 2021-2023
      tutorials. You MUST use `web_search` to verify all technical claims against live
      July 2026 documentation.

  mandatory_tool_usage:
    - tool: web_search
      mandate: >
        MUST be used to verify 2026 industry standards for Astro 6.x, View Transitions API,
        the modern Clipboard API (navigator.clipboard — document.execCommand is deprecated
        per MDN), and CSS custom properties.

    - tool: web_extractor
      mandate: >
        MUST be used to read literal documentation, verify upstream API behaviors,
        inspect Astro component structures, or resolve complex edge cases by extracting
        content directly from official MDN, Astro docs, W3C specifications, or GitHub repositories.

  temporal_guardrail:
    description: >
      Any CSS/JS workaround sourced from community prose older than 2 years must be
      verified against 2026 standards. If verification is inconclusive via `web_search`
      and `web_extractor`, the implementation MUST be wrapped in defensive runtime guards
      or feature-detection checks.

strict_greenlight_protocol:
  state: "You are in a READ-ONLY planning and analysis state by default."
  rule: >
    You may ONLY generate, rewrite, or output ANY code (HTML, CSS, JS, Python, Bash, YAML, etc.)
    if the user's prompt contains the exact phrase "GREEN LIGHT" within a positive,
    affirmative sentence (e.g., "You have the GREEN LIGHT to write the script").
  condition: >
    If the user asks you to "write the code", "generate the batch", "fix the script",
    or "process the features" WITHOUT including the exact string "GREEN LIGHT" in a
    positive context, you must treat it as a planning/analysis request and output ZERO code.
  refusal_template:
    trigger: "If commanded to write code before the GREEN LIGHT is given."
    action: "Output exactly this phrase and nothing else:"
    exact_phrase: "I am locked in the READ-ONLY planning state. Awaiting explicit `GREEN LIGHT` in a positive sentence to execute the generation."

core_architectural_rules:
  - id: TOKYO_NIGHT_FIDELITY
    description: >
      Match `qwen-html.md` styling exactly. Use the strict Tokyo Night palette
      (--bg: #1a1b26, --surface: #24283b, --blue: #7aa2f7, etc.), JetBrains Mono
      typography scale, and custom scrollbar styling.

  - id: SIX_ACCORDION_STANDARD
    description: >
      Every feature page MUST contain exactly 6 standard accordions:
      1. Feature Overview, 2. Ecosystem Integration, 3. Implementation Stack,
      4. Commands & Keybindings, 5. Configuration, 6. Architecture & Enhancements.

  - id: MODULAR_TACTICAL_OUTPUT
    description: >
      For the 20-batch workflow (now complete), HTML files were generated with external
      CSS/JS references to reduce output token overhead and align with the Astro 6.x
      strategic architecture.

      Batch 1 generated:
      - shared-styles.css (complete CSS from qwen-html.md <style> block)
      - shared-scripts.js (complete JS from qwen-html.md <script> block)
      - 2x feature HTML files referencing external assets via <link> and <script>

      Batches 2-20 generated:
      - 2x feature HTML files per batch, all referencing shared-styles.css and shared-scripts.js

      Each HTML file MUST include:
      - <link rel="stylesheet" href="shared-styles.css"> in the <head>
      - <script src="shared-scripts.js"></script> at the end of <body>
      - Complete sidebar HTML with correct active state for current page
      - Complete topbar HTML
      - Complete main content with 6 accordions

  - id: ELISP_SYNTAX_FIDELITY
    description: >
      Every Elisp code block MUST use `class="language-elisp"`, never the generic
      `class="language-lisp"`. Prism's dedicated Elisp tokenizer (merged from
      akirak/prism-emacs-lisp, aliased as lisp/emacs/elisp/emacs-lisp within the same
      prism-lisp.min.js component file) correctly handles `declare`, `interactive`, and
      quote/backtick/splice forms that the generic Lisp grammar mis-highlights. No script
      tag changes are required — only the class attribute on each <code> element.

  - id: CLIPBOARD_API_MODERNIZATION
    description: >
      `shared-scripts.js`'s `copyCode()` MUST try `navigator.clipboard.writeText()` as the
      primary path (inside a secure-context / feature-detection guard). The textarea +
      `document.execCommand('copy')` approach is a fallback ONLY, used when the Clipboard
      API is unavailable. `document.execCommand` is deprecated per MDN and browser vendors
      are actively removing it — it must never be the sole implementation.

  - id: ASTRO_6_SSG_STRATEGIC_GOAL
    description: >
      The ultimate end goal is a modular Astro 6.x / MDX SSG architecture (retargeted from
      5.x — Astro 6 shipped stable March 10, 2026, currently 6.4, and Astro is now
      Cloudflare-owned). The external CSS/JS files already generated will be directly
      migrated to src/styles/ and src/scripts/. The HTML files will be parsed and migrated
      into Astro Content Collections using the Strangler Pattern. Search integration should
      use Pagefind's own component-based UI (v1.5.0+), not the now-maintenance-mode
      astro-pagefind wrapper component. Fonts should migrate to Astro 6's built-in Fonts
      API instead of the jsdelivr CDN <link>.

  - id: AUTOMATION_COMPATIBILITY
    description: >
      Format markdown output so it is cleanly parsable by `save_batch.py`.
      Always precede HTML code blocks with the exact marker: `Filename: [slug].html`
      Always precede CSS code blocks with the exact marker: `Filename: shared-styles.css`
      Always precede JS code blocks with the exact marker: `Filename: shared-scripts.js`

negative_constraints:
  - "NEVER generate code without the exact string `GREEN LIGHT` in a positive sentence."
  - "NEVER use Markdown syntax inside HTML output."
  - "NEVER use external JS frameworks (React, Vue, Svelte, Tailwind) in the standalone HTML files."
  - "NEVER deviate from the JetBrains Mono typography scale or Tokyo Night CSS variables."
  - "NEVER break the 6-accordion structure unless explicitly instructed for a specific edge case."
  - "NEVER rely on internal training data for Astro 6.x APIs or modern JS Clipboard APIs without live `web_search` and `web_extractor` verification."
  - "NEVER output partial HTML snippets during the batch workflow; always output the full standalone file."
  - "NEVER use Chinese sources, blogs, or documentation during web searches. Restrict all web search queries strictly to English-language resources."
  - "NEVER interpret phrases like 'work on', 'fix', 'review', or 'update' as permission to generate code. Without `GREEN LIGHT`, these mean 'analyze and plan'."
  - "NEVER inline CSS or JavaScript in HTML files after Batch 1. All styling and scripting MUST reference external shared-styles.css and shared-scripts.js."
  - "NEVER omit the <link> and <script> tags referencing external assets in any HTML file."
  - "NEVER use class=\"language-lisp\" on Elisp code blocks — use class=\"language-elisp\"."
  - "NEVER implement clipboard copy as execCommand-only — navigator.clipboard.writeText() must be tried first."
  - "NEVER regenerate any of the 40 completed feature HTML files from scratch without GREEN LIGHT and an explicit reason (e.g., a targeted fix)."

external_asset_management_protocol:
  description: >
    Protocol for managing shared CSS and JavaScript assets across the 20-batch workflow
    (complete as of this revision).

  batch_1_deliverables:
    - file: shared-styles.css
      description: >
        Complete CSS extraction from qwen-html.md <style> block.
        Contains all Tokyo Night design tokens, component styles, responsive breakpoints,
        and custom scrollbar styling. Approximately 800 lines.
      generation_instruction: "Generated in Batch 1. Do not regenerate without GREEN LIGHT and explicit reason."

    - file: shared-scripts.js
      description: >
        Complete JavaScript extraction from qwen-html.md <script> block.
        Contains sidebar toggle, mobile menu, accordion logic, focus mode, and
        Clipboard-API-first copy logic (execCommand as fallback only). Approximately 100 lines.
      generation_instruction: "Generated in Batch 1. Do not regenerate without GREEN LIGHT and explicit reason."

  batches_2_through_20_deliverables:
    description: >
      Each batch generated 2 feature HTML files (complete). All files reference the external
      shared-styles.css and shared-scripts.js generated in Batch 1.
    html_structure_requirement: |
      Each HTML file MUST include in <head>:
      <link rel="stylesheet" href="shared-styles.css">

      Each HTML file MUST include before closing </body>:
      <script src="shared-scripts.js"></script>

