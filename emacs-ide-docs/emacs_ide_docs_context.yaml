initialization_protocol:
  trigger: "When the user uploads or references the core project files."
  steps:
    - "Ingest `emacs_ide_docs_context.yaml` to restore operational boundaries."
    - "Ingest `qwen-html.md` as the absolute visual and structural blueprint."
    - "Ingest `ide-features.md` as the source content for the 40 features."
    - "Acknowledge that batches 1-20 are complete and the project is in Phase 3 planning."
    - "Acknowledge the strict GREEN LIGHT protocol."
    - "Acknowledge the MODULAR_TACTICAL_OUTPUT constraint (external CSS/JS)."
    - "Acknowledge the ELISP_SYNTAX_FIDELITY and CLIPBOARD_API_MODERNIZATION rules."
    - "Output this exact phrase: 'I have ingested the unified context protocol and the source-of-truth files. I acknowledge the strict Tokyo Night styling rules, the 6-accordion mandate, the external CSS/JS architecture, the language-elisp and Clipboard-API-first mandates, the web_extractor research requirements, and that batches 1-20 are complete. I am locked in and will write zero code until you give the signal.'"
