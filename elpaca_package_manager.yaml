document:
  title: "The Elpaca Package Manager: Architecture, Async Physics, and `use-package` Integration (v3)"
  description: >
    This document provides a canonical, verified breakdown of the Elpaca package manager (v0.12+),
    its asynchronous queue processing model, and its deep integration with `use-package`.
    All definitions are derived from the official Elpaca manual and source code.
    Verified current as of July 2026.
    v3 CHANGELOG: Corrected the semantics of the `:wait` recipe keyword, which v2 had
    inverted (a "correction" that was itself wrong). Refined the obsolescence claims for
    `:pin`, `:vc`, and `package-quickstart`, which were previously overstated.
  sections:
    - id: 1
      title: Core Philosophy
      points:
        - >
          Elpaca is an asynchronous elisp package manager. It replaces `package.el` by delegating
          downloading, byte-compiling, and activation to background processes.
        - >
          Elpaca processes its package queues *after* Emacs reads the init file (typically via
          `after-init-hook`). This allows for holistic dependency resolution before installation begins.
        - >
          Because installation is asynchronous, standard synchronous load-order assumptions do not apply.
          Code relying on a package being immediately available must be deferred or placed inside the
          `elpaca` macro's body.
    - id: 2
      title: The Asynchronous Execution Timeline
      phases:
        - name: "Phase 1: Bootstrap & Installer"
          items:
            - event: "early-init.el"
              description: >
                `package-enable-at-startup` MUST be `nil`.
            - event: "The Installer Block"
              description: >
                Clones Elpaca, builds it, and loads autoloads. This is the only synchronous operation.
        - name: "Phase 2: Queue Registration (Init File Reading)"
          items:
            - event: "The `elpaca` Macro & `use-package` Expansion"
              description: >
                Calls to `(elpaca ...)` or `(use-package ... :ensure t)` register an "Order" (recipe)
                into an internal queue. They do NOT install packages immediately.
            - event: "The `elpaca-wait` Function"
              description: >
                `(elpaca-wait)` forces a synchronous block, processing all currently queued orders
                immediately and halting init file reading until finished.
                WARNING: Use sparingly (e.g., for `elpaca-use-package` or `no-littering`). Overuse
                destroys async startup performance.
            - event: "The `:wait` Recipe Keyword (v3 CORRECTED)"
              description: >
                v2 of this document claimed `:wait t` blocks only "subsequent queue processing" and
                does NOT halt init-file reading. This was backwards and has been corrected.

                Per the official Elpaca manual: "`:wait` — When non-nil, process all queued orders
                immediately before continuing," and "The `:wait` recipe keyword splits the current
                queue and immediately begins processing prior queues." The use-package integration
                section is explicit that it is used "to block until a package has been installed and
                configured" (e.g. `(use-package general :ensure (:wait t) :demand t)`).

                Because Emacs reads and evaluates init-file top-level forms sequentially, a keyword
                that blocks until a package is installed necessarily pauses evaluation of every form
                that follows it. In practice, `:wait t` on a given order has the SAME effect on
                init-file reading as calling `(elpaca-wait)` immediately after that declaration — it
                is a localized, inline version of `elpaca-wait`, not an exemption from it. The only
                real distinction from the bare `elpaca-wait` function is scope/ergonomics (it is
                attached to one specific order rather than issued as a separate top-level call), not
                whether init-file reading is halted.
        - name: "Phase 3: Queue Processing (Post-Init)"
          items:
            - event: "`elpaca-process-queues`"
              description: >
                Hooked to `after-init-hook`, this triggers async resolution, cloning, building, and
                symlinking of all registered orders.
        - name: "Phase 4: Activation & Post-Init Hooks"
          items:
            - event: "`elpaca-after-init-hook`"
              description: >
                A custom hook that runs ONLY after all queued packages are fully activated.
                Any configuration relying on `after-init-hook` or `emacs-startup-hook` MUST be
                attached here to guarantee package availability.
    - id: 3
      title: Anatomy of an Elpaca Recipe
      keywords:
        - name: ":host / :repo"
          description: "Repository source (e.g., `:host github :repo \"user/repo\"`)."
        - name: ":branch / :ref / :tag"
          description: "Git targeting. `:ref` pins to a commit hash (reproducible), `:tag` to a release."
        - name: ":files"
          description: "Directives for symlinking files. `:defaults` expands to standard globs."
        - name: ":main"
          description: "The main elisp file. Speeds up dependency checking."
    - id: 4
      title: "`use-package` Integration Physics"
      mechanics:
        - title: "The `:ensure` Override"
          detail: >
            `elpaca-use-package-mode` overrides `use-package-ensure-function`. `:ensure` accepts
            a full recipe plist (e.g., `:ensure (:host github ...)`).
        - title: "The `:ensure nil` Bypass"
          detail: >
            Mandatory for built-in packages (e.g., `ibuffer`, `project`) and bundled extensions
            to prevent Elpaca from querying MELPA for non-existent packages.
        - title: "Macro Expansion"
          detail: >
            `(use-package foo :ensure t :config ...)` defers the `:config` block until Elpaca
            has asynchronously installed and loaded `foo`.
    - id: 5
      title: "Obsolete / Superseded Paradigms (v3 REFINED)"
      points:
        - keyword: ":pin"
          v2_claim: "The :pin keyword is OBSOLETE. Use recipe :ref or :tag for pinning."
          v3_correction: >
            Overstated. Elpaca's recipe system DOES still define its own `:pin` keyword — but with
            different semantics than `package.el`/`use-package`'s archive-pinning `:pin`. Elpaca's
            `:pin` means "when non-nil, ignore the package during update commands" (i.e., opt a
            package out of `elpaca-update`/`elpaca-update-all`), not "lock to an archive." It is the
            legacy *archive-pinning* meaning of `:pin` that is obsolete under Elpaca, since Elpaca
            doesn't fetch from `package.el` archives at all — source selection is handled by the
            recipe (`:host`/`:repo`/menus), and version pinning is handled via `:ref`/`:tag`.
        - keyword: ":vc"
          v2_claim: "The :vc keyword is superseded by Elpaca's native recipe system, and is effectively ignored by Elpaca."
          v3_correction: >
            Inaccurate. `elpaca-use-package-mode` only overrides `use-package-ensure-function`
            (i.e., it intercepts `:ensure`). It does not touch the separate handler that Emacs 30's
            built-in `package-vc.el` registers for the `:vc` keyword. If `:vc` is actually used in a
            declaration alongside Elpaca, it is NOT silently ignored — it still invokes
            `package-vc.el`'s own synchronous, non-Elpaca install path, independently of Elpaca's
            async queue, which can produce confusing double-management rather than a clean no-op.
            The correct guidance is: don't mix `:vc` with Elpaca; use the recipe system (`:host`,
            `:repo`, `:ref`) instead of `:vc` entirely.
        - keyword: "package-quickstart"
          v2_claim: "package-quickstart is obsolete."
          v3_correction: >
            Category error. `package-quickstart` is a `package.el` feature and remains fully valid
            in vanilla Emacs configurations that still use `package.el`. It is not "obsolete" in any
            general sense — it is simply INAPPLICABLE under Elpaca, because Elpaca users set
            `package-enable-at-startup nil` and never invoke `package.el`'s activation path that
            `package-quickstart` accelerates.
    - id: 6
      title: Verification Notes
      points:
        - "Source: Official Elpaca Manual (Copyright 2022-2026 Nicholas Vollmer)."
        - >
          v3 correction applied: the `:wait` recipe keyword DOES effectively halt init-file reading
          at the point it is evaluated (same practical effect as calling `elpaca-wait` inline),
          contrary to the v2 "correction," which had this backwards. Verified directly against the
          manual's Recipes/`:wait` keyword reference, its Queues section, and its use-package
          integration section.
        - >
          v3 correction applied: `:pin`, `:vc`, and `package-quickstart` obsolescence claims were
          overstated/imprecise in v2; refined per Section 5 above.
