  critical_instructions:
    preamble: "Before generating any code, making suggestions, or answering questions, you MUST:"
    steps:
      - Read and ingest the attached `early-init.el.txt` file.
      - Read and ingest the attached `config.org.txt` (or `config.org.new.txt`) file.
      - "Read and ingest the attached `system_prompt_protocol.yaml` file to understand your strict operational boundaries, research mandates, and formatting rules."
      - 'Read this `project-state.yaml` file to understand the architectural decisions, the massive "Editor Behaviour" restructuring, and current progress.'
      - Read and ingest use_package.yaml to under how use-package configurations work.
      - Acknowledge these rules and the current state.
    greenlight_reminder: "STRICT GREENLIGHT PROTOCOL: Do not write any code or output any `#+begin_src` blocks until the user explicitly gives the signal to proceed."
  core_architectural_rules:
    - name: Strict Org-Mode Formatting
      description: >
        Zero Markdown syntax is allowed to bleed into Org-mode text or source blocks inside the `config.org` file.
        Use `=code=` or `~code~` for inline code, `*bold*` for bold, `/italics/` for italics, and standard Org headings (`*`, `**`, `***`).
    - name: Vanilla Emacs Paradigm
      description: "Do not use Doom Emacs proprietary macros (e.g., `map!`, `defadvice!`, `use-package!`). Translate Doom-inspired logic into native Vanilla Emacs equivalents."
    - name: Best Emacs Practices
      description: "Prioritize idiomatic, modern, and verifiable best Emacs practices over legacy hacks or outdated wiki snippets."
    - name: Keybinding Management & Leader Paradigm
      description: >
        1. Centralized Manager: `general.el` is the exclusive manager for global and local leader keybindings.
        All `SPC` (global leader) and `SPC m` (local leader) bindings must be routed through custom `general` definers.
        2. Doom Emacs Paradigm: Adhere to Doom Emacs mnemonic prefixes (e.g., `SPC b` for buffers, `SPC f` for files).
        Always include `:wk` annotations for `which-key` discoverability.
        3. `use-package :bind` Restriction: Native `:bind` is strictly reserved for simple global remaps (e.g., `[remap ...]`),
        package-specific internal keymaps (e.g., `:map isearch-mode-map`), or core autoload triggers. It must never be used for `SPC` leader bindings.
        4. Evil Structural Bindings: Operator-pending motions and text objects must be injected directly into Evil's internal C-level keymaps
        (e.g., `evil-inner-text-objects-map`) via `define-key` or `evil-define-motion` in a `:config` block guarded by `:after evil`.
        5. Minibuffer Preservation: Arrow keys are strictly preferred over `hjkl` in the minibuffer and completion maps to preserve the "type-to-filter" paradigm.
        Never force `evil-normal-state` in the minibuffer.
        6. Global Prefix Hygiene: Never bind raw `C-c <letter>` globally; reserve it for major modes. Use leader keys for global commands.
    - name: Corfu Confinement
      description: "`corfu` is strictly confined to buffer editing. It must never be enabled in the minibuffer, as it conflicts with `vertico`."
    - name: Minibuffer Navigation
      description: 'Arrow keys (`<up>`, `<down>`, `C-<up>`, `C-<down>`) are preferred over `hjkl` in the minibuffer and window management to preserve the "type-to-filter" paradigm and prevent Evil state conflicts.'
    - name: Concise Documentation Protocol
      description: 'Documentation inside `config.org` must adhere to the strict Documentation Hierarchy defined in the system prompt protocol (Layman headers, Technical inline comments).'
    - name: Pure Subheader Descriptions
      description: "Subheader descriptions must strictly and exclusively describe what the specific package does in non-technical layman terms. Exclude workflow justifications, personal preferences, or architectural implementation details."
    - name: Bundled Extensions
      description: "Because `elpaca-use-package-by-default` is set to `t` globally, any `use-package` declaration for an extension bundled within a parent package's repository MUST explicitly include `:ensure nil`."
    - name: List Formatting
      description: "`:commands` lists must contain exactly one command per line. `dolist` iterables (such as mode lists) must contain exactly one item or mode per line."
    - name: Elpaca Load-Order Physics
      sub_rules:
        - NEVER use `:hook (elpaca-after-init . mode)` or `:hook (after-init . mode)` to activate global minor modes.
        - For built-in packages, invoke `(mode 1)` directly in `:config` (or `:init` if early interception is required) to eliminate artificial startup latency.
        - Reserve `elpaca-after-init-hook` strictly for cross-package state initialization.
    - name: Elpaca Package Management
      description: >
        Elpaca v0.12 is the exclusive asynchronous package manager. The `:ensure` 
        keyword now accepts Elpaca recipe property lists (e.g., `:ensure (:host github :repo "user/repo")`)
        instead of simple booleans or package names.
    - name: Header Status Keywords
      description: "NEVER add or change a section (`*`) or subsection (`**`) header to `DONE` unless the user explicitly states the phrase `change status from TODO to DONE`. Default to `TODO` or preserve the existing status."
    - name: Emacs 31 Targeting
      description: >
        The configuration explicitly targets Emacs 31. The user is currently daily-driving the `emacs-pretest` package (v31.0.90) built with
        `--with-native-compilation=aot` and `--with-pgtk`. Defensive guards (`fboundp`/`boundp`/version checks) should still wrap highly experimental APIs.
        The MPS incremental/concurrent garbage collector (`igc`) remains deferred out of the Emacs 31 release cycle and must NOT be treated as an Emacs 31 feature.
