  negative_constraints:
    - "No `smartparens` or `puni`: Regex-based pair tracking causes desyncs in complex strings/templates. Lisp-centric soft-deletion is irrelevant for Non-Lisp AST languages."
    - "No `combobulate`: Fundamentally clashes with Evil's operator-pending grammar and causes keymap collisions."
    - "No `tree-edit`: Relies on the legacy `elisp-tree-sitter` (`tsc`) engine and forked grammars, causing dual-engine memory bloat and fatal conflicts with native Emacs 30 `treesit`."
    - "No `expand-region`: Replaced by `expreg`, which utilizes O(1) AST-aware pre-computation via native `treesit` instead of fragile regex/syntax-table heuristics."
    - "No `stripspace`: Replaced by `ws-butler` to prevent Git diff pollution via modified-lines-only trimming."
    - "No `kirigami.el` / `origami.el`: Heavy abstraction layers for folding. A custom transparent dispatcher is preferred for Vanilla Emacs."
    - "No `completion-in-region-function` overrides (Corfu must remain strictly in-buffer)."
    - "No `which-key` Embark Hacks (use `vertico-multiform` grid)."
    - "No `consult-projectile` (obsolete)."
    - "No Minibuffer Evil Normal State (breaks type-to-filter)."
    - "No custom `RET` intercepts for comment continuation (use native `comment-indent-new-line`)."
    - "No custom window movement Elisp functions (use native `windmove-wrap-around`)."
    - "No Nerd Icons inside `prettify-symbols-alist`: Injecting PUA glyphs into buffer text causes mid-line font-fallback context switches and sub-pixel grid misalignments."
    - "No `elpaca-after-init` hooks for built-in global minor modes (use direct `:config` invocation)."
    - "No custom ElDoc backends for `show-paren` (use native Emacs 29+ `'overlay` engine)."
    - "No treating the MPS incremental/concurrent garbage collector (`igc`) as an Emacs 31 feature."
    - "No Package Merging: NEVER merge multiple distinct packages into a single `#+begin_src` block or a single subsection header."
    - "No Scope Creep: NEVER modify, rewrite, or touch subsections, packages, or code blocks that were not explicitly tasked in the current prompt."
    - "No Modular Eglot Stack for IDE Parity: Rejected the modular `eglot` + `flymake` + `dape` ecosystem in favor of the synergistic `lsp-mode` stack."
    - "No Impure Descriptions: NEVER include workflow justifications or implementation details in subheader descriptions."
    - "No Multi-line Lists: NEVER place multiple commands in `:commands ()` or multiple modes in `dolist` on the same line."
    - "No Unauthorized Status Changes: NEVER change a header from `TODO` to `DONE` without the exact phrase `change status from TODO to DONE`."
    - "No `:pin` or `:vc` Keywords: Elpaca manages its own sources and repositories natively via its recipe system. The traditional `package.el` `:pin` keyword and the Emacs 30 `:vc` keyword are obsolete and must never be used."
    - "No Global `C-c <letter>` Bindings: Raw `C-c <letter>` is strictly reserved for major modes to prevent shadowing. Global commands must use leader keys (`SPC`)."
    - "No Technical Jargon in Headers: Top-level and subheader descriptions must strictly use non-technical layman terms. Technical language is strictly confined to inline source code comments."
    - "No Parametric Memory Reliance: NEVER rely on internal training data for Emacs Lisp API behaviors or core file locations. Training data is heavily polluted with outdated wiki pages. MUST use `web_search` and `web_extractor` to verify live source code."
    - "No General.el Enclosure: NEVER place `general-define-key`, `ar/global-leader`, or `ar/local-leader` inside a `use-package` block. Doing so creates a deferred-registration trap where `which-key` annotations remain invisible until the package is manually invoked."
    - "No Blind Legacy Fixes: NEVER assume an issue documented in a 3+ year old forum post or wiki still exists in Emacs 30/31 without live web verification. Inconclusive fixes MUST be wrapped in defensive runtime guards (`fboundp`, `boundp`)."
