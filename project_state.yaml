architectural_decisions:
  triad_paradigm:
    description: >
      The Workflow Management Context Engine strictly replaces `projectile` and `persp-mode` 
      with a synergistic triad:
      1. Buffer Management: `ibuffer` + `projection-ibuffer` (bundled) + `buffer-terminator`.
         Solved the "Redraw Trap" via manual `ibuffer-update` and "Workspace Bleed" via 
         `cl-letf` shadowing of `buffer-list` with `bufferlo-buffer-list`.
      2. Project Management: `project.el` (built-in) + `projection` + `projection-multi`.
         Provides transient build menus and multi-target compilation without background daemons.
      3. Workspaces: `tab-bar` (headless, `tab-bar-show nil`) + `bufferlo` (GNU ELPA).
         Provides mathematically strict buffer isolation per workflow context and daemon-safe 
         bookmark persistence.
  elpaca_async_physics:
    description: >
      Elpaca v0.12 processes queues post-init. 
      - `:ensure t` queues packages asynchronously.
      - `:ensure nil` is MANDATORY for built-in packages (e.g., `ibuffer`, `project`) and 
        bundled extensions (e.g., `projection-ibuffer`) to prevent MELPA query failures.
      - `:wait t` on a recipe halts init-file reading at that exact boundary (acts as an 
        inline `elpaca-wait`). Use sparingly (e.g., `general`, `no-littering`).
      - `elpaca-after-init-hook` must be used instead of `after-init-hook` for any 
        configuration requiring fully activated packages.
  completion_framework:
    description: >
      Vertico + Consult + Marginalia + Corfu + Orderless + Cape.
      - Corfu is STRICTLY confined to buffer editing. It MUST NEVER be enabled in the 
        minibuffer (`global-corfu-minibuffer nil`), as it conflicts with Vertico.
      - Orderless uses a custom "Tofu Dispatcher" to handle Consult's invisible Unicode 
        disambiguation characters and file extensions.
      - Cape uses a "Lean Pipeline Architecture" with defensive boundary guards 
        (`cape-capf-inside-string`, `cape-capf-prefix-length`) to prevent micro-stutters.
  general_el_placement:
    description: >
      All `general-define-key`, `ar/global-leader`, and `ar/local-leader` blocks MUST be 
      evaluated eagerly at startup, entirely OUTSIDE `use-package` closures. Placing them 
      inside deferred `:config` blocks creates a "deferred-registration trap" where 
      `which-key` annotations remain invisible until the package is manually invoked.

negative_constraints:
  elpaca_and_packages:
    - "NEVER use `:pin` for archive pinning. Elpaca's `:pin` means 'opt-out of updates'. Use recipe `:ref` or `:tag` for version locking."
    - "NEVER use `:vc` alongside Elpaca. It invokes `package-vc.el` synchronously, causing double-management. Use Elpaca recipes instead."
    - "NEVER rely on `package-quickstart`. It is inapplicable under Elpaca (`package-enable-at-startup nil`)."
    - "NEVER omit `:ensure nil` for built-in or bundled packages."
  completion_and_minibuffer:
    - "NEVER route `completion-in-region-function` to `consult-completion-in-region`."
    - "NEVER enable Corfu in the minibuffer."
    - "NEVER force `evil-normal-state` in the minibuffer (breaks type-to-filter paradigm)."
  configuration_and_style:
    - "NEVER use Doom proprietary macros (`map!`, `defadvice!`, `use-package!`)."
    - "NEVER use Chinese sources, blogs, forums, or documentation during web searches."
    - "NEVER place `general.el` keybinding definitions inside `use-package` blocks."
    - "NEVER change a header status from TODO to DONE without the exact phrase 'change status from TODO to DONE' or 'finalized'."
    - "NEVER write paragraph-long, tutorial-style text inside `config.org`. Use the Documentation Hierarchy."

