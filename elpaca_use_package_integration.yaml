document:
  title: "Elpaca & use-package: A Self-Contained Technical Reference"
  description: >
    A standalone reference to the Elpaca elisp package manager (progfolio/elpaca) and its
    integration with the `use-package` configuration macro. Covers Elpaca's asynchronous,
    git-based, queue-driven installation model; the full recipe/menu/order vocabulary; the
    `elpaca-use-package-mode` integration layer and exactly how it changes `use-package`'s
    behavior; the interactive package-management UI; and the practical timing pitfalls that
    fall out of Elpaca's async design. Verified directly against Elpaca's `doc/manual.md`,
    `elpaca.el`, `extensions/elpaca-use-package.el`, and the `use-package-core.el`/
    `use-package-ensure.el` sources bundled with current Emacs, current as of August 2026.
  sections:
    - id: 1
      title: Overview
      points:
        - >
          Elpaca is an asynchronous, git-based elisp package manager. It finds, installs,
          updates, and removes third-party Emacs packages, and is a full replacement for the
          built-in `package.el` — it does not use or cooperate with `package.el` at all.
        - >
          Requirements: Emacs >= 27.1, and `git` on `PATH` (no specific minimum git version is
          documented, but a reasonably current git is assumed).
        - >
          The defining architectural fact about Elpaca, and the one everything else in this
          document follows from: package installation is asynchronous and queue-based.
          Declaring a package does not clone/build/activate it before control returns to the
          rest of your init file — it queues the work and returns immediately. Elpaca processes
          its queues only after Emacs finishes reading the init file (by default, via a hook on
          `after-init-hook`). Section 3 covers exactly what this means in practice.
        - >
          `use-package` is a separate macro (bundled with current Emacs; see Section 8) for
          organizing package configuration declaratively — binding keys, deferring loads,
          setting `defcustom`s, and so on. It is not itself a package manager. Elpaca integrates
          with it via an optional extension, `elpaca-use-package`, covered in Section 8.
    - id: 2
      title: Installation
      points:
        - subtopic: "early-init.el"
          detail: >
            Disable `package.el` before it has a chance to run, since Elpaca replaces it
            entirely:
          code: |
            (setq package-enable-at-startup nil)
          note: >
            Also remove any remaining `package.el`-related calls from your init file, such as
            `(package-activate-all)`.
        - subtopic: "Windows symlinks"
          detail: >
            Windows users must be able to create symlinks, or enable `elpaca-no-symlink-mode`:
          code: |
            ;; Uncomment for systems which cannot create symlinks:
            ;; (elpaca-no-symlink-mode)
        - subtopic: "The installer block"
          detail: >
            The following block must appear in `init.el` before any other Elpaca function or
            macro call. It clones Elpaca into `elpaca-directory` (`user-emacs-directory/elpaca/`
            by default) if not already present, byte-compiles it, requires it, generates its
            autoloads, and registers `elpaca-process-queues` on `after-init-hook` so the first
            queue drains once Emacs finishes reading the init file.
          code: |
            (defvar elpaca-installer-version 0.12)
            (defvar elpaca-directory (expand-file-name "elpaca/" user-emacs-directory))
            (defvar elpaca-builds-directory (expand-file-name "builds/" elpaca-directory))
            (defvar elpaca-sources-directory (expand-file-name "sources/" elpaca-directory))
            (defvar elpaca-order '(elpaca :repo "https://github.com/progfolio/elpaca.git"
                                          :ref nil :depth 1 :inherit ignore
                                          :files (:defaults "elpaca-test.el" (:exclude "extensions"))
                                          :build (:not elpaca-activate)))
            (let* ((repo  (expand-file-name "elpaca/" elpaca-sources-directory))
                   (build (expand-file-name "elpaca/" elpaca-builds-directory))
                   (order (cdr elpaca-order))
                   (default-directory repo))
              (add-to-list 'load-path (if (file-exists-p build) build repo))
              (unless (file-exists-p repo)
                (make-directory repo t)
                (when (<= emacs-major-version 28) (require 'subr-x))
                (condition-case-unless-debug err
                    (if-let* ((buffer (pop-to-buffer-same-window "*elpaca-bootstrap*"))
                              ((zerop (apply #'call-process `("git" nil ,buffer t "clone"
                                                              ,@(when-let* ((depth (plist-get order :depth)))
                                                                  (list (format "--depth=%d" depth) "--no-single-branch"))
                                                              ,(plist-get order :repo) ,repo))))
                              ((zerop (call-process "git" nil buffer t "checkout"
                                                    (or (plist-get order :ref) "--"))))
                              (emacs (concat invocation-directory invocation-name))
                              ((zerop (call-process emacs nil buffer nil "-Q" "-L" "." "--batch"
                                                    "--eval" "(byte-recompile-directory \".\" 0 'force)")))
                              ((require 'elpaca))
                              ((elpaca-generate-autoloads "elpaca" repo)))
                        (progn (message "%s" (buffer-string)) (kill-buffer buffer))
                      (error "%s" (with-current-buffer buffer (buffer-string))))
                  ((error) (warn "%s" err) (delete-directory repo 'recursive))))
              (unless (require 'elpaca-autoloads nil t)
                (require 'elpaca)
                (elpaca-generate-autoloads "elpaca" repo)
                (let ((load-source-file-function nil)) (load "./elpaca-autoloads"))))
            (add-hook 'after-init-hook #'elpaca-process-queues)
            (elpaca `(,@elpaca-order))
    - id: 3
      title: "The Asynchronous Model: Queues, Orders, and BODY Timing"
      description: >
        This is the section to read carefully before writing anything nontrivial with Elpaca.
        Almost every surprising behavior traces back to the fact that Elpaca defers work past
        the point where your init file finishes being read.
      points:
        - subtopic: "Orders"
          detail: >
            An order is, at minimum, a symbol naming a package (looked up via Elpaca's menus —
            see Section 5) — `(elpaca example)`. It can also be a partial or full recipe plist:
            `(elpaca (example :host gitlab))` or `(elpaca (example :host gitlab :repo
            "user/example" :inherit nil))`.
        - subtopic: "The `elpaca` macro"
          detail: >
            `(elpaca ORDER &rest BODY)` installs ORDER and evaluates BODY once ORDER's queue has
            finished processing. This is the fundamental installation primitive; `use-package`'s
            `:ensure` keyword (Section 8) expands into a call to this macro.
          code: |
            (elpaca example) ;; recipe looked up in `elpaca-menu-functions'
            (elpaca example (message "Messaged after the order's queue has processed."))
            (elpaca (example :host github :repo "user/example"))
        - subtopic: "Queues process after init-file reading finishes, not inline"
          detail: >
            Elpaca queues orders as it encounters them, and only starts processing a queue once
            it is explicitly told to (by default, via `after-init-hook`, or explicitly via
            `:wait`/`elpaca-wait`/`elpaca-process-queues`; see below). Consider Elpaca's own
            illustrative example:
          code: |
            (elpaca package-a (message "First")) ; Queue First
            (message "Second") ; Second messaged
            (elpaca package-b (message "Third")) ; Queue Third
            (elpaca-process-queues) ; Process queue: First messaged, Third messaged.
          note: >
            "Second" is messaged BEFORE "First" and "Third" — because the `message` calls inside
            each `elpaca` form are BODY forms, deferred until that order's queue is processed,
            while the bare `(message "Second")` between them runs immediately as ordinary elisp.
        - subtopic: "Within one declaration's BODY, evaluation is synchronous and in order"
          detail: >
            Multiple forms inside a single `elpaca` declaration's BODY run synchronously, in the
            order written — it is only the RELATIONSHIP between separate top-level forms in your
            init file that becomes non-deterministic without explicit synchronization:
          code: |
            (elpaca package-a (message "First") (message "Second"))  ; Queue First, Second
            (elpaca package-b (message "Third"))  ; Queue Third
            (elpaca-process-queues) ; Process queue: First, Second, then Third messaged.
        - subtopic: "`:wait` recipe keyword"
          detail: >
            When non-nil, `:wait` splits the current queue and immediately begins processing
            everything queued so far, blocking further init-file evaluation until it finishes.
            This is the standard idiom for a package you need available at top level during init
            reading itself — for example, a package that supplies its own Elpaca menu, or a
            keybinding library like `general.el` that adds its own `use-package` keyword and so
            must be installed before later `use-package` forms can reference that keyword:
          code: |
            (elpaca (melpulls :host github :repo "progfolio/melpulls" :wait t)
              (add-to-list 'elpaca-menu-functions #'melpulls)
              (elpaca-update-menus #'melpulls))
            ;; The next declaration is implicitly queued into a NEW queue.
            (elpaca menu-item-available-in-melpulls)
        - subtopic: "`elpaca-wait`"
          detail: >
            A standalone command that blocks until every order queued up to that point has
            finished processing, without itself queueing a new package. It is the direct,
            top-level equivalent of what `:wait t` does for a single recipe, and is the usual
            tool for creating an explicit "everything above this line is now installed" barrier
            partway through an init file, or in a batch/headless script (see Section 9).
        - subtopic: "`elpaca-after-init-hook`"
          detail: >
            Configuration that itself depends on `after-init-hook` or `emacs-startup-hook` — for
            example, loading a `custom-file` — should instead be attached to
            `elpaca-after-init-hook`, which Elpaca runs only once every queued package has
            finished activating. Attaching such code to the ordinary `after-init-hook` risks it
            running before package installation has actually completed.
          code: |
            (setq custom-file (expand-file-name "customs.el" user-emacs-directory))
            (add-hook 'elpaca-after-init-hook (lambda () (load custom-file 'noerror)))
    - id: 4
      title: Recipes
      description: >
        A recipe is the metadata Elpaca needs to build and install a package: a list of the
        form `(ID . PROPS)`, where ID is a symbol uniquely identifying the package and PROPS is
        a plist of recipe keywords.
      subsections:
        - name: Package Types
          detail: >
            The `:type` keyword names the kind of package being installed; Elpaca looks up a
            matching entry in `elpaca-types` to load the relevant backend if needed. The default
            supported types are `git` (local or remote git repositories), `tar` (tarball
            archives), and `file` (local files/directories). Different types may interpret the
            remaining recipe keywords differently, or ignore some of them entirely.
        - name: "General Recipe Keywords (apply to all package types)"
          keywords:
            - name: ":autoloads"
              detail: >
                Name of the package's autoload file. `nil` disables autoload generation/loading
                entirely for the package. `t` uses the default, `PACKAGE-NAME-autoloads.el`. A
                string is resolved relative to the package's build directory, e.g.
                `"org-loaddefs.el"`.
            - name: ":build"
              detail: >
                A list of build steps, executed in order. `nil` disables all build steps. A
                typical elisp build recipe: (1) get source files on disk, (2) byte-compile and
                generate autoloads, (3) build/install documentation, (4) activate the package
                (add to `load-path`, load autoloads). `elpaca-default-build-steps` holds the
                default step list. Individual steps can be substituted via rules of the form
                `(TYPE TARGET SUBSTITUTIONS...)`, where TYPE is one of:
              build_substitution_types:
                - ":after — places SUBSTITUTIONS after TARGET"
                - ":before — places SUBSTITUTIONS before TARGET"
                - ":first — places TARGET and SUBSTITUTIONS at the beginning of the list"
                - ":last — places TARGET and SUBSTITUTIONS at the end of the list"
                - ":sub — replaces TARGET with SUBSTITUTIONS"
                - ":not — removes TARGET and SUBSTITUTIONS"
              code: |
                (example :build nil) ;; Disable all build steps
                (example :build (:after fn1 fn1.5)) ;; Insert fn1.5 after fn1
                (example :build (:before fn1 fn0)) ;; Insert fn0 before fn1
                (example :build (:sub fn1 subbed)) ;; Substitute fn1 with subbed
                (example :build (:not fn1 fn2)) ;; Remove fn1 and fn2
                ;; A list of rules is applied in order, each to the previous rule's result:
                (example :build ((:after fn1 fn1.5) (:before fn1 fn0) (:sub fn1 subbed) (:not fn1 fn2)))
            - name: ":files"
              detail: >
                The files linked from the package's source directory into its build directory.
                Each element is either the symbol `:defaults` (expands to
                `elpaca-default-files-directive`), a glob-matching string naming files/folders,
                or a list starting with `:exclude` whose remaining elements are NOT linked.
              code: |
                (example :files (:defaults "extensions/*")) ;; Link everything in extensions/
                (example :files (:defaults (:exclude "*.c"))) ;; Exclude .c files
            - name: ":inherit"
              detail: >
                When non-nil, merges in PROPS resolved via `elpaca-order-functions` and
                (depending on the value) `elpaca-menu-functions`. With `:inherit nil`, a
                declaration gets exactly the recipe you wrote and nothing more — for example,
                `(elpaca-recipe '(doct :inherit nil))` returns just `(:source nil :package "doct"
                :id doct :inherit nil)`. With `:inherit t`, Elpaca fills in everything the
                relevant menu (e.g. MELPA) knows: host, repo, `:files`, etc. The value may also
                be a specific menu symbol (or list of menu symbols), scoping inheritance to just
                that menu — e.g. `(elpaca-recipe '(dracula-theme :inherit
                elpaca-menu-nongnu-elpa))` pulls the recipe from the NonGNU ELPA menu
                specifically rather than checking menus in the default order.
            - name: ":main"
              detail: >
                Name of the package's main elisp file. Providing it can speed up dependency
                resolution during cloning; `:main nil` skips dependency checking for that package
                entirely.
              code: |
                (example :main "example.el")
                (example :main nil)
            - name: ":pin"
              detail: >
                When non-nil, excludes the package from bulk update commands
                (`elpaca-fetch-all`, `elpaca-merge-all`, `elpaca-update-all`).
              code: |
                (example :pin t)
            - name: ":vars"
              detail: >
                A list of bindings established via `let*` around a package's build steps. The
                current Elpaca struct and current build step are bound to `elpaca` and
                `elpaca-build-step` within the form. Note that wrapping an `elpaca` DECLARATION
                itself in an ordinary `let*` will NOT keep those bindings in scope by the time
                each build step actually runs, because build steps execute asynchronously —
                `:vars` exists specifically to provide bindings that remain valid across that
                asynchronous boundary.
              code: |
                (elpaca (example :vars ((some-dynamic-var t))))
            - name: ":version"
              detail: >
                A function accepting the current Elpaca struct as its sole argument and
                returning a version string understood by `version-to-list`, for packages that
                don't expose a version conventionally.
              code: |
                (elpaca (example :version (lambda (_) "1.0.0")))
            - name: ":wait"
              detail: "See Section 3 for full discussion; when non-nil, processes all queued orders immediately before continuing."
              code: |
                (elpaca (general :wait t))
        - name: "Repository Recipe Keywords (apply to `:type git` packages)"
          keywords:
            - name: ":branch"
              detail: "The repository branch to check out when installing."
              code: '(example :host github :repo "user/example" :branch "main")'
            - name: ":depth"
              detail: "The repository's clone history depth."
              code: |
                (example :depth treeless) ;; https://git-scm.com/docs/partial-clone
                (example :depth blobless) ;; https://git-scm.com/docs/partial-clone
                (example :depth 1) ;; Shallow clone, history truncated to 1 commit
                (example :depth nil) ;; Full repository clone
            - name: ":host | :fetcher"
              detail: >
                A symbol or string naming the repository's hosting service. Strings are inserted
                into the resulting URI verbatim.
              code: |
                (example :host github)
                (example :fetcher gitlab)
                (example :host "www.example.com")
            - name: ":protocol"
              detail: "The clone protocol: the symbol `https` or `ssh`."
            - name: ":ref"
              detail: "The git ref to check out when installing — e.g. a specific commit."
              code: '(example :host github :repo "user/example" :ref "a76ca0a")'
            - name: ":remotes"
              detail: >
                Configures repository remotes. A string renames the default remote (e.g. to
                "upstream"). A list of `("NAME" [PROPS])` specs adds further remotes, such as a
                personal fork; PROPS may override inherited recipe keywords for that remote. The
                FIRST remote given has its ref checked out on clone.
              code: |
                (example :remotes "upstream")
                (example :host github :repo "upstream/example"
                         :remotes ("fork" :repo "fork/zenburn-emacs"))
                (example :host github :repo "upstream/example"
                         :remotes (("fork" :repo "fork/zenburn-emacs")
                                   ("other" :host gitlab :repo "other/zenburn-emacs")))
            - name: ":repo"
              detail: >
                `USER/REPO` when paired with `:host`; otherwise a local filesystem path or a
                full remote URL. A cons cell `(REMOTE . LOCAL)` renames the local repository
                directory.
              code: |
                (example :host github :repo "user/example") ;; downloaded from github
                (local :repo "~/repos/local/") ;; built from local filesystem
                (remote :repo "https://foo.example/example.git") ;; remote clone
                (remote :repo ("https://foo.example/example.git" . "local-name"))
            - name: ":tag"
              detail: "The tag to check out when installing."
              code: '(example :host github :repo "user/example" :tag "v1.0")'
        - name: "Recipe Inheritance Precedence"
          detail: >
            Highest to lowest: `elpaca-recipe-functions` > declared recipe > `elpaca-order-functions`
            > `elpaca-menu-functions`. `M-x elpaca-info` shows a package's fully resolved,
            inheritance-merged recipe, and is the most reliable way to confirm what Elpaca
            actually intends to do for a given declaration.
        - name: "elpaca-recipe-functions and elpaca-order-functions"
          detail: >
            Both are abnormal hooks run via `run-hook-with-args-until-success`.
            `elpaca-recipe-functions` runs just before installing a package; each function
            receives the current RECIPE and may return nil or a plist to merge in — useful for
            forcing certain keyword values regardless of what recipe inheritance would otherwise
            produce. `elpaca-order-functions` runs earlier, before `elpaca-menu-functions` are
            consulted; each function receives the current ORDER and may return nil or a plist —
            useful for setting default order properties, such as disabling inheritance globally.
          code: |
            ;; elpaca-recipe-functions: force a keyword value on every recipe
            (let ((elpaca-recipe-functions '((lambda (_) (list :cheese 'extra)))))
              (elpaca-recipe 'burger))
            ;; => (:source nil :package "burger" :id burger :type git :protocol https
            ;;     :inherit t :depth treeless :cheese extra)

            ;; elpaca-order-functions: change a default for every order
            (let ((elpaca-order-functions '((lambda (_) '(:inherit nil)))))
              (elpaca-recipe 'burger))
            ;; => (:source nil :package "burger" :id burger :inherit nil)
    - id: 5
      title: Menus
      description: >
        A menu is a function returning an alist of the form `((ID . DATA)...)`. DATA is a plist
        that must contain `:recipe` (a package recipe) and `:source` (a string naming the menu);
        it may also carry `:url`, `:description`, and `:date`, which Elpaca's UI displays when
        present. The menu function must accept a REQUEST argument: the symbol `index` (return
        the alist) or `update` (refresh the menu's alist).
      code: |
        (defun elpaca-menu-minimal (request_)
          "A minimal menu example.
        Ignore REQUEST, as this is a static, curated list of packages."
          '((example :source "EXAMPLE" :recipe (example :host github :repo "user/example"))
            (two :source "EXAMPLE" :recipe (two :host gitlab :repo "user/two"))))
      points:
        - >
          `elpaca-menu-functions` contains menu functions for the following sources by default,
          checked in order until one returns the requested item or the list is exhausted: MELPA,
          Org, Org-contrib, GNU ELPA Mirror, and NonGNU ELPA.
        - >
          `M-x elpaca-update-menus` fetches the latest recipes from a menu source and overwrites
          that menu's item cache.
        - >
          Menus let a package author or curator offer users a ready-made list of recipes — for
          example, `melpulls` (a third-party Elpaca menu) exposes pending, not-yet-merged MELPA
          packages.
    - id: 6
      title: Lock Files
      description: >
        A lock file is a collection of recipes pinned to the exact versions of currently
        installed packages, letting you reproduce a specific Emacs configuration's package
        state elsewhere or later.
      points:
        - >
          `M-x elpaca-write-lock-file` writes a lock file to disk.
        - >
          Setting the `elpaca-lock-file` variable to that file's path causes Elpaca to use those
          pinned versions when installing packages — provided `elpaca-menu-lock-file` is the
          FIRST menu in `elpaca-menu-functions`, so it takes precedence over MELPA/GNU ELPA/etc.
          during recipe resolution.
    - id: 7
      title: "Interactive Package Management (UI)"
      description: >
        Elpaca provides a full UI, built on modes derived from `elpaca-ui-mode`. Its two main
        entry points are `M-x elpaca-manager` (browse/search/act on registered packages) and
        `M-x elpaca-log` (view the processing log, optionally filtered).
      quick_start_table:
        - operation: "Finding Packages"
          ui_keys: "g m (or M-x elpaca-manager)"
          command: "elpaca-info"
        - operation: "Trying Packages (current session only)"
          ui_keys: "i x"
          command: "elpaca-try"
        - operation: "Fetching Package Updates"
          ui_keys: "f x"
          command: "elpaca-fetch or elpaca-fetch-all"
        - operation: "Merging Updates"
          ui_keys: "m x"
          command: "elpaca-merge or elpaca-merge-all"
        - operation: "Updating Packages (alias for 'pull')"
          ui_keys: "p x"
          command: "elpaca-update or elpaca-update-all"
        - operation: "Rebuilding Packages"
          ui_keys: "r x"
          command: "elpaca-rebuild"
        - operation: "Deleting Packages"
          ui_keys: "d x"
          command: "elpaca-delete"
        - operation: "View Package Logs"
          ui_keys: "g l"
          command: "elpaca-log"
        - operation: "Visit Package Source Directory"
          ui_keys: "v"
          command: "elpaca-visit"
        - operation: "Visit Package Build Directory"
          ui_keys: "C-u v"
          command: "C-u M-x elpaca-visit"
        - operation: "Browse Package Website"
          ui_keys: "b"
          command: "elpaca-browse"
      points:
        - >
          "Update" is explicitly documented as an alias for "pull" (fetch + merge in one step).
          It is encouraged to fetch, review the changes, and THEN merge, rather than reaching
          straight for update/pull — the same caution any "pull everything blindly" workflow
          deserves.
        - >
          Packages installed via the interactive/UI commands above (e.g. `elpaca-try`) are
          session-only — they are NOT loaded on subsequent Emacs restarts. To install and load a
          package persistently across restarts, declare it via the `elpaca` macro (or
          `use-package ... :ensure`, Section 8) in your init file, after the installer block.
        - >
          Interactively re-evaluating an `elpaca` declaration re-processes that order, which can
          be used to change a package's recipe before rebuilding it. Rebuilding does NOT reload
          the package into the running Emacs session — restart Emacs after a successful rebuild
          to actually pick up the changes.
      ui_mode_keybindings:
        - {
            key: "!",
            command: "elpaca-ui-send-input",
            description: "Send input string to current process",
          }
        - {
            key: "+",
            command: "elpaca-ui-show-hidden-rows",
            description: "Append rows up to N times elpaca-ui-row-limit",
          }
        - {
            key: "RET",
            command: "elpaca-ui-info",
            description: "Show info for current package",
          }
        - {
            key: "b",
            command: "elpaca-ui-browse-package",
            description: "Browse current package's URL via browse-url",
          }
        - {
            key: "d",
            command: "elpaca-ui-mark-delete",
            description: "Mark package at point for elpaca-delete",
          }
        - {
            key: "f",
            command: "elpaca-ui-mark-fetch",
            description: "Mark package at point for elpaca-fetch",
          }
        - {
            key: "g a",
            command: "elpaca-ui-search-marked",
            description: "Search for #unique #marked",
          }
        - {
            key: "g i",
            command: "elpaca-ui-search-installed",
            description: "Search for #unique #installed",
          }
        - {
            key: "g l",
            command: "elpaca-log",
            description: "Display elpaca-log-buffer filtered by query",
          }
        - {
            key: "g m",
            command: "elpaca-manager",
            description: "Display Elpaca's package management UI",
          }
        - {
            key: "g o",
            command: "elpaca-ui-search-orphaned",
            description: "Search for #unique #orphan",
          }
        - {
            key: "g r",
            command: "elpaca-ui-search-refresh",
            description: "Rerun the current search for buffer",
          }
        - {
            key: "g t",
            command: "elpaca-ui-search-tried",
            description: "Search for #unique #installed !#declared",
          }
        - {
            key: "i",
            command: "elpaca-ui-mark-try",
            description: "Mark package at point for elpaca-try",
          }
        - {
            key: "m",
            command: "elpaca-ui-mark-merge",
            description: "Mark package at point for elpaca-merge",
          }
        - {
            key: "p",
            command: "elpaca-ui-mark-pull",
            description: "Mark package at point for elpaca-pull",
          }
        - {
            key: "r",
            command: "elpaca-ui-mark-rebuild",
            description: "Mark package at point for elpaca-rebuild",
          }
        - {
            key: "s",
            command: "elpaca-ui-search",
            description: "Filter current buffer by query; prompts if query is nil",
          }
        - {
            key: "u",
            command: "elpaca-ui-unmark",
            description: "Unmark current package or packages in active region",
          }
        - {
            key: "v",
            command: "elpaca-ui-visit",
            description: "Visit current package's source or build directory",
          }
        - {
            key: "x",
            command: "elpaca-ui-execute-marks",
            description: "Execute each mark in elpaca-ui-marked-packages",
          }
      searching:
        detail: >
          `elpaca-ui-search` (bound to `s`) prompts for a search query in the minibuffer;
          altering the query live-updates the table. `C-u s` populates the minibuffer with the
          current query for editing. An empty query resets to `elpaca-ui-default-query`. Queries
          are regular expressions checked against each row.
        column_delimiting: >
          The pipe character `|` restricts a text search to a specific column — e.g. `3 |`
          searches only the first column for "3"; `||| 3` searches only the fourth column.
        search_tags: >
          `#tagname` filters by a named search tag (from `elpaca-ui-search-tags`) — e.g.
          `#random` shows 10 random entries. Tags accepting arguments take them in parentheses:
          `#(random 20)` shows 20 random entries. Custom tags can be added by pushing a
          `(NAME . FILTER)` cons onto `elpaca-ui-search-tags`, where FILTER is a function
          accepting (and returning) a list of `tabulated-list-entries`.
    - id: 8
      title: "use-package Integration"
      description: >
        `use-package` is bundled directly with current Emacs (development of the macro itself
        now happens as part of Emacs core rather than in a separate package repository — the
        former standalone `jwiegley/use-package` repository was archived on GitHub on August 23,
        2025). The version currently shipped by Emacs 30.2 and by the Emacs 31 pretest builds is
        2.4.6 (GNU ELPA's own package page lists 2.4.6, dated 2024-08-20, as the current release,
        superseding 2.4.5 and 2.4.4). Elpaca's optional integration extension, `elpaca-use-package`,
        adds Elpaca support to `use-package`'s `:ensure` keyword.
      subsections:
        - name: "Enabling the integration"
          code: |
            (elpaca elpaca-use-package
              ;; Enable Elpaca support for use-package's :ensure keyword.
              (elpaca-use-package-mode))
          note: >
            `elpaca-use-package-mode` is a global minor mode. Because it is itself installed via
            Elpaca, and its effect needs to be active before subsequent `use-package` forms rely
            on `:ensure`, this declaration typically needs no explicit `:wait` — it runs early —
            but any package used AT THE TOP LEVEL of the init file (not merely inside a later
            `use-package` `:config` body) still needs its own `:wait`, as described in Section 3.
        - name: "The `:ensure` keyword, once the mode is enabled"
          detail: >
            `use-package example :ensure t` expands to a call to the `elpaca` macro (Section 3),
            wrapping the rest of the `use-package` form as that order's BODY:
          code: |
            (use-package example :ensure t)
            ;; Expands to:
            (elpaca example (use-package example))
          detail_continued: >
            `:ensure` accepts several forms:
          ensure_values:
            - "`t` (or bare presence): install a package matching the use-package NAME."
            - >
              a bare symbol: install under that different ID rather than the declared NAME —
              useful when the feature a package provides is named differently from how it is
              listed in package menus.
            - >
              a recipe plist: supply a custom recipe. If the ID is omitted and the plist starts
              directly with a keyword, the use-package NAME is automatically prepended as the ID.
            - "`nil`: opt this one declaration OUT of Elpaca handling entirely — see below."
          code_recipe_example: |
            (use-package example :ensure (:host host :repo "user/repo"))
            ;; Expands to:
            (elpaca (example :host host :repo "user/repo")
              (use-package example))
          global_default: >
            Setting `use-package-always-ensure` to a non-nil value makes every `use-package` form
            behave as though `:ensure t` were given, without writing it out on each declaration.
            An older variable, `elpaca-use-package-by-default`, is a formally obsolete alias of
            `use-package-always-ensure` (deprecated 2024-02-08) — current configurations should
            set `use-package-always-ensure` directly.
        - name: "`:ensure nil` — opting a declaration out entirely"
          detail: >
            Useful for configuring built-in Emacs functionality via the `emacs` pseudo-feature.
            Forms declared this way are evaluated IMMEDIATELY, not deferred through Elpaca's
            queue system:
          code: |
            (use-package emacs :ensure nil :config (setq ring-bell-function #'ignore))
        - name: "Blocking on a package needed at the top level"
          detail: >
            The `:wait` recipe keyword (Section 3) works the same way inside `:ensure`. This is
            the standard pattern for a package — such as a keybinding library that adds its own
            `use-package` keyword — that later `use-package` forms in the same init file need to
            already be available:
          code: |
            (use-package general :ensure (:wait t) :demand t)
            ;; use-package declarations beyond this point may use the `:general' use-package keyword.
        - name: "Legacy `:straight` / `:elpaca` compatibility keywords"
          detail: >
            For configurations carried over from a different package manager's integration,
            `:straight` and `:elpaca` are also recognized as aliases for `:ensure`, using the
            same underlying handling. Using them emits a deprecation warning; current
            configurations should use `:ensure` directly.
        - name: "How the integration actually changes `use-package`'s behavior"
          detail: >
            `elpaca-use-package-mode` is a global minor mode. Enabling it installs `:override`
            advice on `use-package`'s existing `:ensure` handler and normalizer functions,
            replacing their behavior with Elpaca's own (queue-based) implementation rather than
            `use-package`'s default `package.el`-based one; disabling the mode removes that
            advice and restores the previous behavior. The mode ALSO advises `use-package`'s
            `:vc` handler and normalizer in the same way: a `:vc` spec (in the same style Emacs's
            built-in `package-vc.el` understands — `:url`, `:branch`, `:main-file`, `:lisp-dir`)
            is automatically converted into an Elpaca recipe and installed through Elpaca's own
            queue, UNLESS the same declaration also specifies `:ensure nil`, in which case `:vc`
            handling is skipped for that declaration. Only a subset of `package-vc.el`'s spec
            keys have an Elpaca equivalent (`:url`→`:repo`, `:branch`→`:branch`,
            `:main-file`→`:main`, `:lisp-dir`→`:files`); any other spec key is silently ignored
            rather than raising an error, so a `:vc` spec relying on less-common options may
            install without those options taking effect. While the mode is active, `:vc` is
            positioned to fire immediately before `:ensure` in `use-package`'s keyword-processing
            order (and moved back to its ordinary position when the mode is disabled).
        - name: "Where `:ensure` sits in use-package's own keyword pipeline"
          detail: >
            `use-package` processes a fixed, ordered list of keywords per declaration, held in
            the `use-package-keywords` variable. As literally defined, that list does not include
            `:ensure` or `:pin` at all — its base order runs: `:disabled :load-path :requires
            :defines :functions :preface :if :when :unless :no-require :catch :after :custom
            :custom-face :bind :bind* :bind-keymap :bind-keymap* :interpreter :mode :magic
            :magic-fallback :hook :commands :autoload :init :defer :demand :load :config`.
            `:ensure` and `:pin` are added separately and automatically the moment `use-package`
            itself is loaded (this support is on by default): `:pin` is prepended to the front of
            that list first, then `:ensure` is prepended after it — so `:ensure` ends up as the
            very FIRST keyword processed of any declaration, firing even before `:load-path`.
            `:load` still sits near the very end of the pipeline, directly before `:config` — this
            is where the actual `(require 'foo)` happens for a non-deferred package, and it is
            what creates the gap discussed next.
        - name: "The `:init` vs `:config` timing pitfall"
          detail: >
            Because `:ensure` fires first and `:load`/`:config` fire last, a `use-package`
            declaration under Elpaca has TWO layers of deferral stacked on top of each other,
            and it is easy to fix one while forgetting the other:
          layers:
            - layer: "Outer layer — Elpaca's queue"
              explanation: >
                `:ensure` queues the whole rest of the declaration (as the `elpaca` order's
                BODY) and returns immediately. Nothing about this declaration runs synchronously
                relative to the REST of your init file unless you add `:wait` (or a preceding
                `(elpaca-wait)`).
            - layer: "Inner layer — use-package's own :init-before-:load ordering"
              explanation: >
                Even once the outer queue has processed and this declaration's BODY (the
                deferred `use-package` form) finally runs, `use-package`'s OWN keyword pipeline
                still applies within it: `:init` still fires before `:load`/`:config`. Adding
                `:wait` collapses the OUTER layer — it does nothing to reorder the INNER one.
          example: >
            Suppose a package's `defcustom` needs to be appended to before that package's
            minor mode is activated — for instance, adding entries to a disabled-modes list
            before turning the mode on. Doing this in `:init`, even with `:wait (:wait t)` on
            the declaration, still fails: at `:init` time, the package's own `defcustom` forms
            have not run yet (that happens at `:load`, which is still positioned after `:init`
            inside the now-unblocked BODY), so the variable is unbound and `add-to-list` signals
            a `void-variable` error. Pre-declaring the variable via `defvar` in `:preface` avoids
            the error but backfires differently: since `defvar` never overwrites an
            already-bound variable, your value locks in permanently before the package's own
            `defcustom` can ever establish its own default.
          fix: >
            Do the modification in `:config` instead. By the time `:config` runs, `use-package`'s
            own `:load` step has already executed `(require ...)`, so the package's `defcustom`
            has already registered its default value; appending to it in `:config` is then safe
            regardless of whether the declaration's OUTER Elpaca-queue deferral was collapsed
            with `:wait` or left fully asynchronous. `:config` is the generally safe place for
            any modification of a package's internals: `defcustom` lists, keymaps, advice, and
            activating global minor modes.
    - id: 9
      title: "Practical Patterns"
      points:
        - subtopic: "Headless / batch scripting"
          detail: >
            Because fetch, merge, and update operations (Section 7) are themselves asynchronous,
            a batch script must explicitly block on `(elpaca-wait)` before relying on their
            results — otherwise the script may proceed, or even exit, before the operation has
            actually finished. A representative pattern for scripted maintenance:
          code: |
            emacs --batch -l ~/.emacs.d/early-init.el -l ~/.emacs.d/init.el --eval \
              "(progn (elpaca-fetch-all) (elpaca-wait) (elpaca-merge-all) (elpaca-wait) \
                      (elpaca-write-lock-file \"~/.emacs.d/elpaca.lock\"))"
          note: >
            `(elpaca-update-all)` followed by `(elpaca-wait)` can substitute for the
            fetch/wait/merge/wait pair as a faster, one-step "pull everything" shortcut, at the
            cost of the review opportunity that fetching-then-merging otherwise gives you.
        - subtopic: "Recommended update workflow"
          detail: >
            Fetch first (`elpaca-fetch`/`elpaca-fetch-all`), review what changed, then merge
            (`elpaca-merge`/`elpaca-merge-all`) — rather than reaching directly for
            `elpaca-update`/`elpaca-update-all`, which fetches and merges in one step without a
            review point in between.
        - subtopic: "Keep `:init` minimal"
          detail: >
            As a general habit — independent of any specific bug — push as much configuration
            as possible into `:config` rather than `:init`. `:config` runs after the package has
            actually loaded and its own defaults are established, which sidesteps the entire
            class of pitfall described in Section 8.
        - subtopic: "Use `elpaca-info` to check what will actually be installed"
          detail: >
            When recipe inheritance, menu resolution, and any `elpaca-recipe-functions`/
            `elpaca-order-functions` are all in play, the fully-resolved recipe Elpaca will
            actually use can differ from what you wrote. `M-x elpaca-info` shows that resolved
            recipe directly, rather than requiring you to trace inheritance by hand.
    - id: 10
      title: Sources
      points:
        - "Elpaca `doc/manual.md`, fetched directly from the `progfolio/elpaca` repository (current `master` branch)."
        - '`elpaca.el` (current version 0.2.0, `Package-Requires: ((emacs "27.1"))`), fetched directly.'
        - "`extensions/elpaca-use-package.el`, fetched directly, for the exact `:ensure`/`:vc` advice mechanism and the `:straight`/`:elpaca` alias registration."
        - >
          `use-package-core.el` and `use-package-ensure.el`, read from the archived
          `jwiegley/use-package` GitHub mirror for the base `use-package-keywords` order and the
          `:ensure`/`:pin` keyword-registration mechanism (development of `use-package` itself
          now happens in Emacs core; the former standalone repository is archived and read-only
          as of August 23, 2025). Note: that archived mirror's own internal version string
          (`use-package-version`) still reads "2.4.4," which is stale relative to what Emacs
          actually ships — GNU ELPA's package page lists 2.4.6 (2024-08-20) as current, and that
          is the version this document treats as authoritative for what Emacs 30.2/31 bundle.
          The base keyword list itself is not expected to have changed across these patch
          versions, but readers relying on exact keyword-list contents should confirm against
          their own running Emacs's `use-package-keywords` value.
        - "Current stable Emacs release is 30.2 (August 2025); Emacs 31 was in pretest (31.0.91, July 2026) with no official release date announced as of this writing."
      note: "Verified current as of August 2026."
