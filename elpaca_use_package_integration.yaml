document:
  title: "Elpaca Package Manager & `use-package` Integration: Architecture, Asynchronous Physics, and Queue-Order Execution (v1)"
  description: >
    This document provides a canonical, unified breakdown of the Elpaca package manager
    (progfolio/elpaca) and its integration with the `use-package` macro (v2.4.5+, bundled with
    Emacs 30.2, min. Elpaca requirement Emacs >= 27.1). It details Elpaca's asynchronous,
    git-based, queue-driven installation model, its `use-package` keyword integration (which
    reuses and overrides the native `:ensure` keyword rather than adding a new one), and
    queue-order load dependencies. This is a direct architectural counterpart to a companion
    document covering straight.el; wherever the two package managers diverge, that divergence
    is called out explicitly, because it is the single most common source of migration bugs.
    All definitions are derived from the official Elpaca manual (`progfolio/elpaca`, `doc/manual.md`),
    `elpaca.el` and `extensions/elpaca-use-package.el` source, the official GNU Emacs
    `use-package` User Manual, the upstream `use-package` source (jwiegley/use-package), and
    the Elpaca GitHub wiki's "Migrating to Elpaca" page, cross-checked against Emacs 30.2 core.
    Verified current as of August 2026.
  sections:
    - id: 1
      title: Core Philosophy
      points:
        - >
          Elpaca is an asynchronous, git-based elisp package manager that replaces `package.el`
          entirely. Packages are cloned as git (or `tar`/`file`-type) repositories rather than
          downloaded as archive tarballs. Package state is defined by the init-file's `elpaca`
          declarations plus an optional lock file (`elpaca-write-lock-file` /
          `elpaca-lock-file`), with no other persistent data. Like straight.el, Elpaca has no
          native cooperation with `package.el`; users must set `package-enable-at-startup` to
          `nil` and remove any `(package-activate-all)` calls.
        - >
          `use-package` is not a package manager. Its primary purpose is to organize package
          configuration declaratively, eliminate repetitive boilerplate, and enable lazy-loading
          (autoloading) to keep Emacs startup times low. This is unchanged from any other backend.
        - >
          CRITICAL DIVERGENCE FROM SYNCHRONOUS PACKAGE MANAGERS (e.g. straight.el): Elpaca
          installs packages asynchronously and in parallel, via a queue system. Registering a
          package with the `elpaca` macro (or the `:ensure` `use-package` keyword, once
          `elpaca-use-package-mode` is enabled) does NOT clone/build/activate that package
          in-line before control returns to the next form in the init file. It instead pushes an
          "order" onto the current queue and returns immediately; the queue's orders are
          processed after Emacs finishes reading the init file (Elpaca hooks
          `elpaca-process-queues` onto `after-init-hook` by default). Standard synchronous,
          top-to-bottom load-order assumptions therefore do NOT apply by default: a package
          declared on one line is not guaranteed to be installed, let alone required, by the
          time the next line of your init file runs. The two escape hatches from this are the
          `:wait` recipe keyword (splits the current queue and blocks on it immediately) and the
          standalone `(elpaca-wait)` call (blocks until everything queued so far has finished
          processing) — both discussed in Section 2. There is no equivalent of straight.el's
          `straight-check-for-modifications` rebuild-detection machinery, because Elpaca's build
          pipeline runs its own dependency/build graph per queue rather than scanning the
          filesystem for modifications at every startup.
      files:
        - path: "~/.config/emacs/early-init.el"
          note: >
            `package-enable-at-startup` MUST be `nil` here, before `package.el` gets a chance to
            run, exactly as with any other non-`package.el` manager. On Windows, either ensure
            the user can create symlinks or enable `elpaca-no-symlink-mode`.
        - path: "~/.config/emacs/init.el"
          note: >
            The Elpaca installer block (bootstrapping `elpaca-directory`,
            `elpaca-builds-directory`, `elpaca-sources-directory`, and the `elpaca-order` for
            Elpaca itself) must be the very first Elpaca-related code in this file, before any
            other call to `elpaca`, `use-package`, or Elpaca functions. It clones Elpaca via
            `git clone`/`git checkout` in a child buffer, byte-recompiles it, requires it, and
            generates its autoloads; `(add-hook 'after-init-hook #'elpaca-process-queues)` is
            registered as part of this same block so that the very first queue drains once init
            reading completes.
    - id: 2
      title: The Asynchronous Queue-Processing Timeline
      description: >
        Because Elpaca is queue-based, this "timeline" is not a single linear pass through the
        init file the way straight.el's is. Reading the init file only POPULATES queues; nothing
        in a given queue actually clones, builds, or (critically) evaluates a `use-package`
        BODY until that queue is processed — which, absent `:wait` or `(elpaca-wait)`, does not
        happen until after the entire init file has been read.
      phases:
        - name: "Phase 0: Bootstrap (Synchronous, unconditionally so)"
          items:
            - event: "early-init.el"
              description: >
                `package-enable-at-startup` set to `nil` to prevent `package.el` interference.
            - event: "The Installer Block"
              description: >
                Checks for an existing local Elpaca checkout under `elpaca-directory`
                (`user-emacs-directory/elpaca/`); if absent, clones
                `https://github.com/progfolio/elpaca.git`, checks out the pinned `:ref` (`nil`
                by default, i.e. the repository's default branch tip, unless overridden),
                byte-recompiles it in a synchronous subprocess, and generates its own autoloads.
                This bootstrap step is the one part of Elpaca's entire lifecycle that is always
                synchronous — every other queue is async by design.
        - name: "Phase 1: Order Registration, Recipe Resolution, and Queueing (Inline, during init read)"
          description: >
            This phase happens once per `elpaca` call (or per `:ensure` keyword under
            `elpaca-use-package-mode`), and it returns to the next init-file form almost
            immediately — it does NOT wait for cloning or building to finish.
          items:
            - event: "Recipe/Order Resolution"
              description: >
                If only a package symbol was given, Elpaca looks it up via `elpaca-menu-functions`
                (checked in order: MELPA, Org, Org-contrib, GNU ELPA Mirror, NonGNU ELPA, by
                default). If a partial or full recipe plist was given, it is merged with any
                inherited defaults per the precedence order:
                `elpaca-recipe-functions` > declared recipe > `elpaca-order-functions` >
                `elpaca-menu-functions`.
            - event: "Queueing"
              description: >
                The order is pushed onto Elpaca's current queue. This is the first action Elpaca
                takes for a given declaration — nothing about the package's git state is touched
                yet.
            - event: "Clone (deferred, asynchronous, parallelized)"
              description: >
                When the queue is later processed, if the local repository is not already present
                under `elpaca-sources-directory`, it is cloned (respecting `:depth`,
                `:protocol`, `:remotes`, and the ref specified by `:branch`/`:tag`/`:ref`, or by
                the lock file if one is active). Multiple packages' clones proceed in parallel
                rather than one-at-a-time.
            - event: "Build (deferred, asynchronous)"
              description: >
                Elpaca's default build steps (`elpaca-default-build-steps`) get the source files
                on disk, byte-compile the package's elisp, generate/link autoloads (per
                `:autoloads`), and build documentation. `:build` can customize, reorder, or
                disable these steps via its `:after`/`:before`/`:first`/`:last`/`:sub`/`:not`
                substitution DSL, or be set to `nil` to skip building entirely. There is no
                filesystem-watcher/`find`-based modification-detection layer analogous to
                straight.el's `straight-check-for-modifications`; Elpaca does not re-scan
                already-built packages for local edits on every startup by default.
            - event: "Activation (adding load-path, loading autoloads — NOT full `require`)"
              description: >
                Once built, Elpaca activates the package: adds its build directory to
                `load-path` and loads its autoloads file. This makes autoloaded commands/
                functions callable, but it does NOT `require` the package's features.
                `defcustom`, `defvar`, and `defun` forms inside the package's main file are NOT
                yet evaluated. This is the load-bearing fact for Section 5's case study, and it
                is functionally identical in spirit to straight.el's own "installing activates
                autoloads but does not require features" behavior — the two managers agree here
                even though one is sync and the other is async.
            - event: "BODY Evaluation (queue-order-dependent, NOT init-file-order-dependent)"
              description: >
                Only after activation does Elpaca evaluate the *BODY* forms passed to the
                `elpaca` macro — and, critically, under `elpaca-use-package-mode`, THE ENTIRE
                `use-package` FORM (minus the now-consumed `:ensure` recipe) becomes that BODY.
                `(use-package example :ensure t :init (foo) :config (bar))` expands to
                `(elpaca example (use-package example :init (foo) :config (bar)))`. This means
                the whole `use-package` declaration — including its own internal `:init`/`:config`
                keyword pipeline — does not run until Elpaca decides to process that specific
                order's queue. Declaration BODY forms within a single `elpaca`/`use-package` call
                are still evaluated synchronously and in declared order relative to each other;
                it is the timing of the whole declaration relative to OTHER top-level forms in
                the init file that becomes non-deterministic without `:wait`/`elpaca-wait`.
        - name: "Phase 1.5: Queue Draining — `:wait`, `elpaca-wait`, and `after-init-hook`"
          description: >
            Because Phase 1's queueing defers real work, Elpaca provides explicit synchronization
            points. This phase has no counterpart in straight.el's model, because straight.el
            never needs to be told to "catch up."
          items:
            - event: "`:wait` recipe keyword"
              description: >
                `(elpaca (general :wait t))` — or, under `use-package`, `:ensure (:wait t)` —
                splits the current queue and immediately begins processing every order queued so
                far, blocking until it finishes, before evaluating anything past that point. This
                is the standard idiom for packages needed at top-level during init reading itself
                (e.g. `general.el`, which registers its own `use-package` keyword, or a package
                that supplies an `elpaca-menu-functions` entry).
            - event: "`(elpaca-wait)`"
              description: >
                A standalone, widely used call (documented via the `:wait` mechanism it is built
                on, and ubiquitous in real-world Elpaca configs) that blocks until every order
                queued up to that point has finished processing, without itself queueing a new
                package. Configs commonly sprinkle `(elpaca-wait)` after a batch of related
                `use-package` forms to create explicit synchronization checkpoints, functioning
                as Elpaca's rough equivalent of the "everything above this line is now installed
                and required" guarantee that straight.el gives for free after every single form.
            - event: "`after-init-hook` / `elpaca-after-init-hook`"
              description: >
                By default, `elpaca-process-queues` runs on `after-init-hook`, so any queue not
                already drained via `:wait`/`elpaca-wait` finishes there. Configuration that
                itself relies on `after-init-hook` or `emacs-startup-hook` (loading `custom-file`,
                starting a server, etc.) must instead be attached to `elpaca-after-init-hook`,
                which Elpaca runs only once ALL queued packages have finished activating —
                otherwise such code races against package installation.
        - name: "Phase 2: use-package's Own Keyword Pipeline (per form, once its queue is processed)"
          description: >
            Independent of Elpaca, `use-package-core.el` defines a fixed evaluation order via
            the `use-package-keywords` defcustom. Its BASE order — as literally defined in
            `use-package-core.el`, with NEITHER `:ensure` NOR `:pin` present — runs: `:disabled
            :load-path :requires :defines :functions :preface :if :when :unless :no-require
            :catch :after :custom :custom-face :bind :bind* :bind-keymap :bind-keymap*
            :interpreter :mode :magic :magic-fallback :hook :commands :autoload :init :defer
            :demand :load :config`. `:ensure` and `:pin` are added SEPARATELY, at the moment
            `use-package-ensure.el` loads (which happens by default whenever `use-package` is
            required), via two back-to-back `(add-to-list 'use-package-keywords ...)` calls.
            Because `add-to-list` PREPENDS by default, and `:pin` is added first followed by
            `:ensure`, the net effect is that `:ensure` becomes the very FIRST keyword processed
            of all of them — firing even before `:load-path` — with `:pin` immediately behind it.
            Under `elpaca-use-package-mode`, firing `:ensure` means "queue this order and defer
            the REST of the macro's expansion (including `:init` and `:config`) into that order's
            BODY," not "clone and build inline, then keep going," as it would under straight.el's
            added `:straight` keyword. Separately, `elpaca-use-package-mode` ALSO repositions and
            reinterprets the built-in `:vc` keyword while active — see the dedicated `:vc` item
            below and Section 6, which corrects the straight.el companion document's "don't mix
            `:vc` with your package manager" guidance for Elpaca's case specifically. `:load`
            still sits directly before `:config`, near the very end of the pipeline — this is
            where the actual `(require 'foo)` happens for non-deferred packages, and it still
            creates a gap between "package files exist and autoloads are active" and "the
            package's real symbols exist," exactly as under straight.el, just nested one level
            deeper inside an async queue instead of a synchronous top-level pass.
          items:
            - event: ":disabled Check"
              description: >
                Checked by the macro itself via `(unless (memq :disabled args) ...)`, entirely
                outside and prior to the `use-package-keywords` pipeline. `(use-package foo
                :disabled nil)` is still disabled; only the keyword's presence matters. Identical
                under every backend.
            - event: ":ensure (Elpaca's integration point — an OVERRIDDEN keyword, not a new one)"
              description: >
                Elpaca does not add a `:straight`-style third-party keyword for its primary
                mechanism. Instead, the global minor mode `elpaca-use-package-mode` (defined via
                `define-minor-mode :global t` in `extensions/elpaca-use-package.el`) uses
                `(advice-add #'use-package-handler/:ensure :override #'elpaca-use-package--handler)`
                and the equivalent for `use-package-normalize/:ensure` to swap the native
                `:ensure` keyword's implementation wholesale, in a way that is fully reversible —
                turning the mode back off calls `advice-remove` on both. `:ensure t` queues an
                order for a package matching the declared feature name; `:ensure some-other-name`
                (a bare symbol) installs under that different ID instead of the feature name;
                `:ensure (recipe...)` supplies a custom recipe (a bare plist, with NAME
                automatically prepended as the ID if the plist starts with a keyword rather than
                an explicit ID); `:ensure nil` opts the declaration out of Elpaca's handling
                entirely for that one form. This can be made implicit for every declaration by
                setting `use-package-always-ensure` to non-nil — the SAME variable `package.el`
                and straight.el each also recognize, not a separate Elpaca-only variable. (An
                older variable, `elpaca-use-package-by-default`, is now a formally obsolete alias
                of `use-package-always-ensure`, deprecated 2024-02-08, precisely so that configs
                do not need an Elpaca-specific knob.) For backward compatibility with configs
                migrating from straight.el, `elpaca-use-package.el` ALSO — separately, and
                unconditionally, via plain `defalias` and `add-to-list` calls made once at
                load-time rather than being gated by the minor mode — registers `:straight` and
                `:elpaca` as deprecated aliases for the same handler/normalizer functions. Because
                this registration happens outside the mode toggle, `:straight`/`:elpaca` remain
                usable (with a deprecation warning) even if `elpaca-use-package-mode` is later
                turned off, unlike `:ensure`/`:vc` handling, which IS mode-gated. Current configs
                should use `:ensure`, not `:straight`/`:elpaca`.
            - event: ":vc (also intercepted and reinterpreted while `elpaca-use-package-mode` is active)"
              description: >
                This is the single biggest point of divergence from the straight.el companion
                document's guidance, and it is easy to get backwards. `elpaca-use-package-mode`
                ALSO advises `use-package-handler/:vc` and `use-package-normalize/:vc` (again via
                `advice-add :override`, reversible the same way), and repositions `:vc` — via
                `use-package-list-insert` — to fire immediately before `:ensure` while the mode is
                active (it is moved back to sit before `:no-require`, roughly where Emacs 30's
                built-in `package-vc.el` originally registered it, when the mode is switched off).
                In practice: a `:vc` spec written for Emacs's native `package-vc.el` is
                automatically converted into an Elpaca recipe and wrapped in an `elpaca` order —
                UNLESS the same declaration also includes `:ensure nil`, in which case `:vc`
                handling is skipped and the declaration is left unmanaged. The conversion only
                maps a subset of `package-vc.el`'s spec keys to Elpaca recipe keys (`:url` →
                `:repo`, `:branch` → `:branch`, `:main-file` → `:main`, `:lisp-dir` → `:files`);
                any other `package-vc.el` spec key is silently dropped rather than erroring, so an
                exotic `:vc` spec may lose fidelity when auto-converted. See Section 6 for the
                full correction of this point relative to straight.el's guidance.
            - event: ":preface"
              description: >
                Evaluated before conditionals (after `:disabled`, and — once the order's queue is
                processed — after `:ensure` has finished queueing/deferring). Runs at both
                byte-compile time and load time; must stay side-effect-free.
            - event: ":if / :when / :unless"
              description: >
                Gates whether the *rest* of the declaration loads, by wrapping the remainder in
                `(when PRED ...)`. Same mechanism regardless of backend.
            - event: ":custom / :custom-face"
              description: >
                Expands to `customize-set-variable` calls. Because these sit well before `:init`
                and `:load`/`:config` in the base keyword order, they still run before the package
                is actually required — same behavior as under any other backend, once the
                surrounding declaration's queue has been processed.
            - event: "Autoload Triggers (:hook, :bind, :mode, :commands)"
              description: >
                Register autoloads/deferred triggers in Emacs; they do not force the package to
                load immediately. This layer is entirely a `use-package` feature, orthogonal to
                which package manager is installing the package underneath — and orthogonal to
                Elpaca's OWN, separate layer of deferral (the queue itself).
            - event: ":init"
              description: >
                Evaluated before `:load`/`:config`, i.e. before the real `(require 'foo)` happens
                — same as under any backend. WARNING: by the time `:init` runs, Elpaca has
                already cloned/built/autoload-activated the package (the BODY containing this
                `use-package` form only began evaluating because the order's build finished). It
                is tempting to assume the package is fully "ready" for this reason. It is not —
                its `defcustom`/`defvar`/`defun` forms have not been evaluated yet, for the exact
                same reason as under straight.el: use-package's own internal `:load` position, not
                anything about Elpaca's async model. Referencing package-specific variables in
                `:init` still typically raises a `void-variable` error.
            - event: ":load / (implicit require)"
              description: >
                This is where `use-package` actually loads the package for non-deferred
                declarations (or where deferred declarations get their autoload-triggered load
                later). This is the true "boundary" inside a single declaration's own pipeline —
                distinct from, and nested inside, the coarser boundary Elpaca's queue system
                already applies to the whole declaration.
            - event: ":config"
              description: >
                Evaluated after the package has fully loaded (i.e., after the `:load` step, or
                after a deferred autoload trigger fires and pulls the package in). This is the
                bulletproof phase for modifying a package's internal `defcustom` lists, altering
                keymaps, advising functions, and activating global minor modes — identical
                guidance to any other backend, and for the same underlying reason.
    - id: 3
      title: Anatomy of an Elpaca Recipe
      keywords:
        - name: ":type"
          description: >
            Symbol identifying the package type; Elpaca looks up a matching entry in
            `elpaca-types` to load the relevant backend. Default supported types are `git`
            (local/remote git repositories), `tar` (tarball archives), and `file` (local files/
            directories). Different types interpret the remaining recipe keywords differently or
            ignore some altogether.
        - name: ":host / :fetcher"
          description: >
            Repository hosting service, e.g. `:host github` (or the `:fetcher` alias). Strings
            are inserted into the resulting URI verbatim, e.g. `:host "www.example.com"`.
        - name: ":repo"
          description: >
            `USER/REPO` when paired with `:host`; a bare local path or full remote URL otherwise.
            A cons cell `(REMOTE . LOCAL)` renames the on-disk local repository directory.
        - name: ":branch / :tag / :ref"
          description: >
            Git branch, tag, or specific ref/commit to check out when installing. Applies to
            `:type git` packages.
        - name: ":remotes"
          description: >
            Configures additional git remotes beyond the default (the first remote's ref is what
            gets checked out on clone). A bare string renames the default remote (e.g. to
            "upstream"); a list of `("NAME" [PROPS])` specs adds further remotes, such as a
            personal fork, each of which may override inherited recipe keywords like `:host`/
            `:repo` individually.
        - name: ":protocol / :depth"
          description: >
            `:protocol` is `https` or `ssh`. `:depth` controls clone depth/performance:
            `treeless` or `blobless` (git partial-clone modes), an integer for a shallow clone
            truncated to that many commits, or `nil` for a full clone.
        - name: ":files"
          description: >
            Files linked from the package's source directory into its build directory. Elements
            are the symbol `:defaults` (expands to `elpaca-default-files-directive`), glob-
            matching strings, or an `(:exclude ...)` list to omit specific files. Roughly
            analogous in purpose to straight.el's `:files` DSL, though the directive syntax and
            defaults differ.
        - name: ":main"
          description: >
            The package's main elisp file. Declaring this can speed up dependency resolution;
            setting it to `nil` skips dependency checking for that package entirely.
        - name: ":inherit"
          description: >
            When non-nil, merges in properties resolved via `elpaca-order-functions` and/or
            `elpaca-menu-functions` (the value may also name a specific menu symbol or list of
            menu symbols, scoping inheritance to just that/those menus for this one recipe).
            `:inherit nil` opts a declaration out of menu-supplied defaults entirely — useful
            when you want to guarantee only the properties you wrote yourself apply.
        - name: ":autoloads"
          description: >
            Name of the package's autoload file. `nil` disables autoload generation/loading for
            the package entirely; `t` uses the default (`PACKAGE-NAME-autoloads.el`); a string is
            resolved relative to the package's build directory (e.g. `"org-loaddefs.el"`).
        - name: ":build"
          description: >
            An ordered list of build steps, or `nil` to disable building entirely. Individual
            steps can be inserted/removed/substituted relative to Elpaca's default pipeline
            (`elpaca-default-build-steps`) using `:after`/`:before`/`:first`/`:last`/`:sub`/
            `:not` substitution rules, each naming a `TARGET` function and `SUBSTITUTIONS`.
        - name: ":pin"
          description: >
            When non-nil, EXCLUDES the package from bulk update commands (`elpaca-fetch-all` /
            `elpaca-merge-all`). This is a MEANINGFUL, actively used recipe keyword under Elpaca
            — unlike straight.el, which has no dedicated "exclude from bulk update" keyword at
            all and instead relies on updating packages individually. Do not confuse this
            recipe-level `:pin` with the separate, package.el-oriented `:pin` `use-package`
            keyword described in Section 6, which remains meaningless under Elpaca.
        - name: ":vars"
          description: >
            A list of bindings established via `let*` around the package's build steps. Because
            build steps run asynchronously, wrapping an `elpaca` declaration in an ordinary
            `let*` form will NOT keep those bindings in scope by the time each step actually
            executes — `:vars` exists specifically to work around that async timing gap; it has
            no real analogue in straight.el's synchronous model, where an enclosing `let*` works
            fine.
        - name: ":version"
          description: >
            A function accepting the current Elpaca struct and returning a version string
            understood by `version-to-list`, for packages that don't expose one conventionally
            (e.g. build systems like AUCTeX that determine their version at build time).
        - name: ":wait"
          description: >
            When non-nil, splits the current queue and processes every order queued so far
            immediately, blocking further init-file evaluation until it finishes. See Section 2,
            Phase 1.5. THIS is Elpaca's direct analogue to the synchronization straight.el gives
            for free on every single form — straight.el has no equivalent keyword because there
            is nothing to wait FOR in a synchronous model.
      note: >
        Recipe inheritance precedence, highest to lowest: `elpaca-recipe-functions` > declared
        recipe > `elpaca-order-functions` > `elpaca-menu-functions`. `elpaca-info` will display a
        package's fully-resolved, inheritance-merged recipe, which is the most reliable way to
        confirm what Elpaca actually intends to do with a given declaration.
    - id: 4
      title: "Detailed `use-package` Keyword Breakdown (Elpaca-specific)"
      keywords:
        - name: ":ensure"
          subtitle: Queueing, Clone, Build, and Autoload Activation (Asynchronous, Deferred)
          details:
            - label: Mechanism
              text: >
                Once `elpaca-use-package-mode` is enabled, Elpaca overrides `use-package`'s
                existing `:ensure` handler/normalizer functions via `defalias`, rather than
                registering a brand-new keyword. `:ensure t` queues an order for the declared
                package name; `:ensure (recipe...)` customizes the source; `:ensure nil` opts a
                single declaration OUT of Elpaca handling entirely (evaluated immediately,
                un-deferred by the queue system — useful for configuring built-in Emacs features
                via the `emacs` pseudo-feature).
            - label: Global default
              text: >
                Set `use-package-always-ensure` to a non-nil value to make every `use-package`
                form implicitly behave as though `:ensure t` were given, without writing it out.
                This is the SAME variable `package.el` and straight.el each also recognize —
                there is no Elpaca-specific equivalent variable to reach for (the historical
                `elpaca-use-package-by-default` is a formally obsolete alias of this variable,
                deprecated 2024-02-08). This is the mirror image of straight.el's guidance, which
                explicitly tells users to REMOVE `use-package-always-ensure` on migration; under
                Elpaca, that removal should be reverted.
        - name: ":init"
          subtitle: Pre-Load Execution (The "Unconditional" Trap — still present, still a trap)
          details:
            - label: Purpose
              text: >
                Sets up state the package's own load sequence might read, or defines hooks/
                variables that must exist before the package initializes.
            - label: Constraint
              text: >
                By the time `:init` runs, Elpaca has already cloned/built/autoload-activated the
                package — this use-package form's BODY only began evaluating because that
                order's queue finished processing. But the package's actual functions and
                variables (from its `defcustom`/`defvar`/`defun` forms) generally don't exist
                yet, because the real `(require ...)` happens later, at `use-package`'s own
                `:load` position, which is INSIDE the same already-deferred BODY. Referencing
                them in `:init` typically still raises a `void-function` or `void-variable`
                error — a subtler trap under Elpaca than under straight.el, because the
                package-manager-level deferral (queue → BODY) and the use-package-level
                deferral (`:init` before `:load`) are stacked on top of each other, and it is
                easy to fix the outer one (with `:wait`) while forgetting the inner one is still
                there.
        - name: ":config"
          subtitle: Post-Load Execution (The Safe Zone — still present)
          details:
            - label: Purpose
              text: >
                The safe place to call the package's functions, modify its keymaps, advise its
                internals, and activate its global minor modes.
            - label: Best Practice
              text: >
                Keep `:init` forms minimal and put as much as possible into `:config`, exactly as
                under any other backend — the reasoning is `use-package`'s own keyword order, not
                anything specific to being sync or async.
    - id: 5
      title: "Case Study: The `evil-snipe` `defcustom` List Modification"
      problem:
        description: >
          In an `evil-snipe` configuration, a list of UI modes must be appended to
          `evil-snipe-disabled-modes` to prevent the package from hijacking native keybindings
          in read-only or UI-heavy buffers.
      analysis:
        - approach: "Why `:init` Fails (even after Elpaca's queue has finished processing this package)"
          explanation: >
            This is the point most migrators get wrong in the opposite direction from
            straight.el: they assume that because Elpaca is asynchronous, adding `:wait` or an
            `(elpaca-wait)` checkpoint before referencing `evil-snipe-disabled-modes` fully
            "solves" the timing problem. It solves ONE layer of deferral (Elpaca's queue) but
            not the other (`use-package`'s own internal keyword order), which is completely
            unaffected by `:wait`:
          steps:
            - >
              Suppose the declaration uses `:ensure (:wait t)` (or is preceded by
              `(elpaca-wait)`), so by the time the NEXT form in the init file runs, `evil-snipe`
              has definitely been cloned, built, and autoload-activated — Elpaca's own part of
              the job is fully done, synchronously, from the init file's point of view.
            - >
              But within THIS declaration's own BODY (the deferred `use-package` form Elpaca
              hands off to once the order finishes), `use-package`'s `:load` step — the point at
              which `(require 'evil-snipe)` actually happens and `evil-snipe.el`'s top-level
              `defcustom` forms actually run — still sits near the END of `use-package-keywords`,
              right before `:config`, i.e. AFTER `:init`. `:wait` blocks the OUTER queue; it does
              not reorder the INNER `use-package-keywords` pipeline.
            - "So at `:init` time, `evil-snipe-disabled-modes` is still unbound, exactly as under straight.el."
            - "Calling `add-to-list` on an unbound symbol signals a `void-variable` error, aborting the `:init` block, just as it would under any backend."
            - >
              Pre-declaring the variable via `defvar` in `:preface` trades this for a subtler
              issue: since `defvar` never overwrites an already-bound variable, your custom list
              locks in permanently before `evil-snipe.el`'s own `defcustom` can establish its
              upstream default.
        - approach: "Why `:config` is Bulletproof"
          explanation: >
            Placing the `dolist` at the very beginning of `:config` guarantees this sequence,
            regardless of package manager — and regardless of whether Elpaca's outer queue
            deferral has been collapsed with `:wait`/`elpaca-wait` or left fully async:
          steps:
            - "`use-package`'s `:load` step runs first: `(require 'evil-snipe)` evaluates, and its `defcustom` registers the upstream default list."
            - "Your modification runs: the `dolist` executes, safely appending your custom modes to the already-populated upstream list."
            - "The mode activates: `(evil-snipe-mode 1)` executes only after your modification."
    - id: 6
      title: Obsolete / Superseded / Repurposed / Inapplicable Paradigms Under Elpaca
      points:
        - keyword: ":ensure / use-package-always-ensure"
          claim: >
            Because straight.el's migration guidance says to remove `:ensure` and
            `use-package-always-ensure`, the same advice must apply to Elpaca.
          correction: >
            The OPPOSITE is true, and this is the single most consequential difference from the
            straight.el companion document. Elpaca's officially documented and supported
            mechanism IS the native `:ensure` keyword and the native `use-package-always-ensure`
            variable — Elpaca deliberately overrides the existing package.el-oriented handler
            rather than introducing a parallel `:elpaca`-branded keyword/variable pair the way
            straight.el introduced `:straight`/`straight-use-package-by-default`. A config
            migrating FROM straight.el TO Elpaca that dutifully removed `:ensure`/
            `use-package-always-ensure` per straight.el's own guidance will need to ADD THEM
            BACK. `:straight` and bare `:elpaca` are retained only as deprecated, warning-emitting
            compatibility aliases for `:ensure` — they are not the current interface.
        - keyword: ":pin (use-package keyword, from use-package-ensure.el)"
          claim: "`:pin` still means something useful under Elpaca, e.g. archive pinning."
          correction: >
            Meaningless in practice, for the same reason as under straight.el: `:pin` (added to
            `use-package-keywords` by `use-package-ensure.el` for `package.el` archive-pinning)
            has nothing to pin, because Elpaca-managed packages are never installed from a
            `package.el` archive in the first place. HOWEVER — unlike straight.el — Elpaca DOES
            repurpose a keyword spelled `:pin` at the RECIPE level (see Section 3) to mean
            "exclude this package from `elpaca-fetch-all`/`elpaca-merge-all`." These are two
            different `:pin`s in two different namespaces (`use-package` keyword vs. Elpaca
            recipe plist key) that happen to share a name; do not conflate them.
        - keyword: ":vc"
          claim: >
            Since straight.el's `use-package` integration leaves `:vc` untouched — so that
            combining `:vc` with straight.el silently invokes `package-vc.el`'s own separate
            install path and risks double-management — the same must be true of Elpaca, and the
            same "don't mix them" guidance must apply.
          correction: >
            FALSE for Elpaca specifically — this is the opposite of the straight.el behavior, and
            it is the single most consequential correction in this section. Verified directly
            against `extensions/elpaca-use-package.el`: while `elpaca-use-package-mode` is
            active, it advises BOTH `use-package-handler/:vc` and `use-package-normalize/:vc` (not
            just `:ensure`), and repositions `:vc` to fire immediately before `:ensure`. A `:vc`
            spec written in native `package-vc.el` style is therefore AUTOMATICALLY CONVERTED into
            an Elpaca recipe and installed via Elpaca's own queue — it is not left to run through
            `package-vc.el` unmanaged, and there is no double-management risk of the kind
            straight.el users face. The real caveat under Elpaca is narrower and different in
            kind: the conversion only understands a handful of `package-vc.el` spec keys (`:url`,
            `:branch`, `:main-file`, `:lisp-dir`); any other spec key you were relying on is
            silently dropped rather than erroring or warning, so a `:vc` spec that leans on
            less-common `package-vc.el` options may install "successfully" but incompletely.
            Adding `:ensure nil` to a `:vc` declaration is the explicit opt-out if you want the
            spec left for `package-vc.el` to handle unmanaged, mirroring how `:ensure nil` opts
            any declaration out of Elpaca entirely.
        - keyword: "package-quickstart"
          claim: "package-quickstart is obsolete."
          correction: >
            Category error, same as under straight.el. `package-quickstart` is a `package.el`
            feature and remains fully valid in vanilla Emacs configurations that still use
            `package.el`. It is simply INAPPLICABLE under Elpaca, because Elpaca users set
            `package-enable-at-startup nil` and never invoke `package.el`'s activation path that
            `package-quickstart` accelerates.
        - keyword: "Elpaca is 'just straight.el but async'"
          claim: "The two managers are interchangeable drop-ins for each other, modulo sync/async."
          correction: >
            Overstated. Beyond the sync/async split, they differ in: HOW they integrate with
            `use-package` (overriding the existing `:ensure` handler vs. registering an entirely
            new `:straight` keyword — this is the source of Section 6's `:ensure`/
            `use-package-always-ensure` reversal above); default menu/recipe-source priority
            order (MELPA/Org/Org-contrib/GNU-ELPA-Mirror/NonGNU-ELPA vs. straight.el's
            MELPA/GNU-ELPA-mirror/Emacsmirror); the total absence of `package.el` support in
            straight.el by design (Elpaca is similarly non-cooperative with `package.el`, though
            documentation for each project frames this slightly differently); the queue/BODY-
            deferral model with `:wait`/`elpaca-wait` synchronization points (no equivalent exists
            in straight.el, because nothing needs to be waited for); the lock-file model
            (`elpaca-write-lock-file` writing a lock file consumed via `elpaca-lock-file` +
            `elpaca-menu-lock-file`, vs. `straight-freeze-versions` writing
            `straight/versions/<profile>.el` with multi-profile support via `straight-profiles`);
            and the update-command model (Elpaca's live `manual.md` documents THREE distinct
            command pairs — `elpaca-fetch`/`elpaca-fetch-all` (fetch only), `elpaca-merge`/
            `elpaca-merge-all` (merge already-fetched changes), and a separate
            `elpaca-update`/`elpaca-update-all` explicitly documented as "an alias for pull" —
            with the manual itself recommending fetch-then-review-then-merge over the update/pull
            shortcut, vs. `straight-pull-package`/`straight-pull-all` followed by a separate
            `straight-freeze-versions` step). Treat this document and its straight.el
            companion as two distinct references, not one document with a find-and-replace
            applied.
    - id: 7
      title: "Ecosystem Tooling: Keeping Elpaca Packages Up To Date (including topgrade)"
      description: >
        This section exists because it is a very common practical question and a very common
        source of surprise: general-purpose "upgrade everything" tools do not understand
        Elpaca's per-package git checkouts by default, and Elpaca's own async model adds a
        wrinkle straight.el's users don't have to think about even when scripting updates.
      points:
        - topic: "Interactive, in-Emacs update workflow (canonical)"
          detail: >
            `M-x elpaca-fetch` (single package) or `M-x elpaca-fetch-all` (every registered
            package) fetches upstream changes WITHOUT merging them. `M-x elpaca-merge` /
            `elpaca-merge-all` then merges ALREADY-FETCHED changes into each package's local
            checkout. A third, distinct command pair, `M-x elpaca-update` / `elpaca-update-all`,
            is documented directly in Elpaca's manual as "an alias for 'pull'" — i.e. fetch and
            merge combined into one step, for a single package or all of them respectively; it is
            NOT a prefix-argument variant of `elpaca-merge`, but its own separate command. The
            Elpaca manual explicitly recommends the fetch-then-review-then-merge workflow over
            reaching for `elpaca-update(-all)` directly, so changes can be inspected before being
            applied — the same underlying caution straight.el's `straight-pull-*` commands carry,
            just split across two explicit steps (plus a shortcut third) instead of one.
            `M-x elpaca-write-lock-file` writes a lock file
            capturing exact installed revisions; setting `elpaca-lock-file` to that file's path
            (with `elpaca-menu-lock-file` placed first in `elpaca-menu-functions`) makes future
            installs reproduce those exact versions. `M-x elpaca-rebuild` rebuilds a package from
            its current checkout without touching git state, and `M-x elpaca-delete` removes a
            package Elpaca no longer needs.
        - topic: "Command-line / batch equivalent"
          detail: >
            The same operations can be run headlessly by loading the real init file (so every
            `elpaca`/`:ensure` order actually gets queued) and then calling the equivalent
            functions — but because those functions are themselves async, the batch script must
            explicitly block on `(elpaca-wait)` (or otherwise ensure `elpaca-process-queues` has
            fully drained) before proceeding to write a lock file, or the script may exit, or the
            lock file may get written, before fetch/merge has actually finished. A representative
            invocation: `emacs --batch -l ~/.emacs.d/early-init.el -l ~/.emacs.d/init.el --eval
            "(progn (elpaca-fetch-all) (elpaca-wait) (elpaca-merge-all) (elpaca-wait)
            (elpaca-write-lock-file \"~/.emacs.d/elpaca.lock\"))"`. This asynchronicity-aware
            blocking step is the building block for any external automation, including topgrade,
            and it has no counterpart in the straight.el companion document's batch example,
            which needed no equivalent blocking because straight.el's operations are already
            synchronous. `(elpaca-update-all)` (still followed by `(elpaca-wait)`) can be
            substituted for the fetch/wait/merge/wait pair as a faster, one-step "pull everything"
            shortcut for unattended automation, at the cost of the review opportunity the
            fetch-then-merge split otherwise gives you — the same fetch-vs-pull trade-off the
            manual itself flags for interactive use applies equally to scripted use.
        - topic: "topgrade: no native Elpaca step exists"
          detail: >
            As of the current topgrade-rs releases (the actively maintained fork of the original,
            now-archived r-darwish/topgrade), topgrade has no dedicated Elpaca update step. Its
            built-in "Emacs" step is oriented around `package.el` and does not know about
            `elpaca-sources-directory`/`elpaca-builds-directory`. No `[elpaca]`-equivalent config
            section, nor any Elpaca-aware git-repo detection, appears in the maintained fork's
            config schema or issue tracker as of August 2026.
        - topic: "topgrade: the Doom Emacs exception does NOT extend to Elpaca"
          detail: >
            topgrade DOES have a dedicated `[doom]` config section and explicitly detects Doom
            Emacs to run `doom upgrade` instead of its generic Emacs step, because Doom is itself
            built on straight.el internally. This exception is straight.el-specific, not
            "any third-party-package-manager-based framework"-generic: it does NOT extend to
            Elpaca-based configurations or frameworks, even ones that structurally resemble Doom
            (e.g. curated, opinionated Elpaca-based starter configs). If your Emacs setup uses
            Elpaca — Doom-adjacent or fully standalone — none of topgrade's Doom-detection logic
            applies to you, and you need one of the two options below.
        - topic: "Recommended: a topgrade custom command"
          detail: >
            Add a custom step to `topgrade.toml` (current schema: `[commands]`, or
            `[pre_commands]`/`[post_commands]` if you want it to run before/after everything else)
            that loads the init file in batch mode and calls the fetch/wait/merge/wait sequence
            above, then disable topgrade's own package.el-oriented Emacs step so it doesn't run
            redundantly:
          example_config: |
            [commands]
            "Emacs packages (Elpaca)" = "emacs --batch -l ~/.emacs.d/early-init.el -l ~/.emacs.d/init.el --eval \"(progn (elpaca-fetch-all) (elpaca-wait) (elpaca-merge-all) (elpaca-wait))\""

            [misc]
            disable = ["emacs"]
        - topic: "Not recommended as primary method: pointing topgrade's [git] repos glob at elpaca-sources-directory/*"
          detail: >
            topgrade's `[git]` section does support a `repos` list with glob patterns (e.g.
            `repos = ["~/.emacs.d/elpaca/repos/elpaca/sources/*"]`), which would make topgrade's
            generic git-pull step walk into every package checkout and run a plain `git pull`.
            This is tempting but risky for the same reason it is under straight.el: Elpaca-managed
            repositories may be checked out at a specific `:ref`/`:tag`/detached commit rather
            than tracking a local branch. A blind `git pull` against a detached HEAD has no
            upstream branch to pull from and will typically fail outright — and in cases where it
            does succeed, it can leave the repo diverged from what its recipe (or lock file)
            specifies on the next Emacs startup, forcing a manual `git` fixup or
            `M-x elpaca-rebuild`. The batch fetch/merge approach above is preferred because Elpaca
            itself resolves the correct target ref per package (recipe branch/tag/ref, fork
            remote, lock-file pin) rather than treating every repo identically.
    - id: 8
      title: Verification Notes
      points:
        - >
          Primary Source: Official GNU Emacs `use-package` User Manual (v2.4.5, bundled with
          Emacs 30.2), and `jwiegley/use-package` upstream, both files fetched and read directly
          rather than summarized from memory: `use-package-core.el` (confirming the literal base
          `use-package-keywords` defcustom contains neither `:ensure` nor `:pin`), and
          `use-package-ensure.el` (confirming `:ensure`/`:pin` are prepended to that list via
          `add-to-list` at load time — `:pin` first, then `:ensure`, so `:ensure` ends up firing
          before every other keyword including `:load-path` — and that this file, and therefore
          this prepending, is loaded by default whenever `use-package` itself is required).
        - "Primary Source: `progfolio/elpaca`, `doc/manual.md` (current `master` branch, fetched live), covering the Installer block, Recipes (package types; general and repository-scoped recipe keywords including `:wait`, `:pin`, `:build`, `:vars`, `:inherit`), Menus, Orders, Queues, Lock Files, and the `use-package Integration` section documenting `:ensure`/`elpaca-use-package-mode` directly."
        - "Primary Source: `extensions/elpaca-use-package.el` source, confirming the `defalias`-based override of `use-package-handler/:ensure`/`use-package-normalize/:ensure`, the deprecated `:straight`/`:elpaca` compatibility aliases, and `elpaca-use-package-by-default` as an obsolete alias of `use-package-always-ensure` (deprecated 2024-02-08)."
        - >
          `(elpaca-wait)` as a standalone top-level call is extremely well attested across
          real-world Elpaca configurations and the project's own issue tracker (e.g. issue #261,
          referencing "the existing usage of elpaca-wait by calling it at the top-level of init
          files"), and is the mechanism the documented `:wait` recipe keyword is built on. It is
          treated here as a confirmed, load-bearing part of Elpaca's public API, though it is not
          given its own dedicated numbered subsection in the current `manual.md` prose the way
          `:wait` is — readers should be aware the manual documents it primarily through the
          recipe-keyword form.
        - >
          The three-way split between `elpaca-fetch`/`elpaca-fetch-all`, `elpaca-merge`/
          `elpaca-merge-all`, and `elpaca-update`/`elpaca-update-all` (documented as the "pull"
          alias) was confirmed against the live `doc/manual.md` Quick Start table, fetched
          directly rather than relied on from memory. An EARLIER, superseded state of the project
          (a 2023 commit renaming `elpaca-update(-all)` to `elpaca-merge(-all)`, with pull
          available only via a prefix argument on merge) was also found during research; the
          CURRENT, live manual no longer matches that older commit's description and instead
          documents `elpaca-update`/`elpaca-update-all` as its own restored, separate command
          pair, which is what this document follows. This is flagged explicitly because it is
          exactly the kind of drift a document "verified current as of" a given date needs to
          resolve in favor of the most recently fetched source, not the most authoritative-looking
          older one.
        - >
          `extensions/elpaca-use-package.el` was fetched directly (not relied on from an earlier,
          partial excerpt) to confirm the exact mechanism of Elpaca's `use-package` integration:
          `elpaca-use-package-mode` is a global minor mode that toggles `advice-add`/
          `advice-remove` of `:override` advice on `use-package-handler/:ensure`,
          `use-package-normalize/:ensure`, `use-package-handler/:vc`, and
          `use-package-normalize/:vc` together, and repositions `:vc` relative to `:ensure` via
          `use-package-list-insert` as part of that same toggle. The `:straight`/`:elpaca`
          compatibility aliases, by contrast, are registered via unconditional, top-level
          `defalias`/`add-to-list` forms in the same file, outside the minor-mode toggle. An
          earlier draft of this document mischaracterized the `:ensure` override as a bare
          `defalias` and stated that `:vc` was left untouched by Elpaca's integration; both points
          are corrected here against this primary source.
        - >
          topgrade findings confirmed against: the archived `r-darwish/topgrade` issue tracker's
          historical package-manager-support requests; the current `topgrade-rs/topgrade` README,
          `config.example.toml`, and open issue tracker (including an open, unresolved "Request a
          new step" issue thread dated July 2026, with no Elpaca-specific step filed or merged as
          of this writing); and the `[doom]`-section/`Emacs::is_doom()` behavior, which was
          confirmed to be straight.el-specific rather than generically third-party-package-
          manager-aware.
        - >
          Emacs 31 Context: Emacs 31 entered its feature-freeze/branch-cut phase near June 2026.
          Public release previews confirm no structural changes to `use-package`'s keyword ordering
          or macro expansion logic since the 30.2 baseline, so none of the above is expected to
          shift with Emacs 31. Elpaca's own stated minimum requirement remains Emacs >= 27.1.
